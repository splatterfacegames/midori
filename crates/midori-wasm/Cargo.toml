[package]
name = "midori-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the Midori procedural tree generator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
midori-core = { path = "../midori-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
toml = "0.8"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["console"]
