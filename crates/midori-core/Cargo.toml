[package]
name = "midori-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for procedural tree generation"

[dependencies]
glam = { version = "0.29", features = ["libm"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
gltf = "1.4"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.10"
