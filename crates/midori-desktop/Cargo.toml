[package]
name = "midori-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Tauri desktop shell for the Midori workbench"
build = "build.rs"

[lib]
name = "midori_desktop"
path = "src/lib.rs"

[[bin]]
name = "midori-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tools-frontend-host-tauri = { git = "https://github.com/splatterfacegames/jethaforge.git", rev = "304d283815d831be4458178fa8918c33703b4323" }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The Tauri/webview dependency tree is very large under full debuginfo; trim
# dependency symbols so dev builds stay usable on shared build machines.
[profile.dev.package."*"]
debug = "line-tables-only"
