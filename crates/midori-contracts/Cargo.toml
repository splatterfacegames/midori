[package]
name = "midori-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generated Midori FlatBuffers application contracts and their Rust encoding surface"

[dependencies]
# Pinned to the flatc that generated `src/generated/`. The `serialize` feature is
# required: `projection_generated.rs` serializes generated table accessors with
# serde, which needs the flatbuffers crate's own Serialize impls for Vector.
flatbuffers = { version = "=25.12.19", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# One test proves DESCRIPTOR_SHA256 really is the digest of the checked-in
# `schemas/generated/tree.bfbs`. Same pin as `midori-ui-domain`.
sha2 = "=0.10.9"
