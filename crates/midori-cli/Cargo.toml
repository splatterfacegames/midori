[package]
name = "midori-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the Midori procedural nature generator"

[[bin]]
name = "midori"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
midori-core = { path = "../midori-core" }
serde_json = "1.0"
