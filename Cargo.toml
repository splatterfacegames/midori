[workspace]
resolver = "2"
members = [
    "crates/midori-core",
    "crates/midori-cli",
    "crates/midori-wasm",
    "crates/midori-ffi",
    "crates/midori-contracts",
    "crates/midori-ui-domain",
]
# midori-desktop is intentionally outside the workspace: it consumes the private
# jethaforge stack (tools-frontend-host-tauri), while the engine workspace must
# resolve and build with no private dependencies. Build/test it via
# `cargo test --manifest-path crates/midori-desktop/Cargo.toml` or `npm run desktop`.
exclude = ["crates/midori-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# edition 2024 requires rustc >= 1.85; dependency floor (image) is 1.88
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/splatterfacegames/midori"

# The Tauri/webview dependency tree is very large under full debuginfo.
# Keep local workspace crates fully debuggable but trim dependency symbols so
# `cargo build`/`test`/`tauri dev` stay usable on shared build machines.
[profile.dev.package."*"]
debug = "line-tables-only"
