[workspace]
resolver = "2"
members = [
    "crates/midori-core",
    "crates/midori-cli",
    "crates/midori-wasm",
    "crates/midori-ffi",
    "crates/midori-ui-domain",
    "crates/midori-contracts",
]
# `app/` is a Tauri application with its own workspace and lockfile, exactly as
# the shared stack's reference workbench is laid out. Keeping its large native
# dependency tree out of this workspace keeps engine builds unaffected by it.
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jethac/midori"
