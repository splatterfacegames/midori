# Swan Coastal Plain Tuart Woodland (Spearwood limestone belt: Kings Park, Bold Park, Ludlow).
#
# Ecological notes:
# - Tall pale-barked Tuart (Eucalyptus gomphocephala) open woodland over dense weeping
#   WA Peppermint (Agonis flexuosa) and Banksia attenuata midstorey, informed by
#   EPBC Approved Conservation Advice for Tuart Woodlands and Forests (2019).
# - Density multipliers and shrub weights are game-scale estimates.

