  size_classes = { sapling = 0.15, pole = 0.30, mature = 0.45, veteran = 0.10 }

  [[strata.species]]
  preset = "presets/species/wa_firewood_banksia.toml"
  share = 0.38
  size_classes = { sapling = 0.15, pole = 0.28, mature = 0.47, veteran = 0.10 }

  [[strata.species]]
  preset = "presets/species/wa_bull_banksia.toml"
