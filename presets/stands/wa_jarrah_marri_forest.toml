# Northern Jarrah-Marri Forest (Darling Scarp & Perth Hills lateritic uplands).
#
# Ecological notes:
# - Overstorey Jarrah (Eucalyptus marginata) / Marri (Corymbia calophylla) open forest
#   (50-70% canopy, 20-32 m) over Bull Banksia & WA Sheoak midstorey informed by
#   Dell, Havel & Malajczuk (1989) "The Jarrah Forest" and Beard (1990).
# - 8-year fuel age reflects WA prescribed-burn cycles, charring lower Jarrah trunks.
# - Species proportions and clump radii are game-scale estimates.

[asset]
kind = "nature_stand"
name = "WA Jarrah-Marri Forest"

[stand]
biome = "wa_jarrah_marri_forest"
floor = "presets/nature/wa_jarrah_forest_floor.toml"
seed = 4002
tile_size = 128.0
edge_width = 8.0
exclude_trunk_clearance = 1.8
variants_per_species_size = 3
collision_min_diameter = 0.18

[stand.condition]
years_since_fire = 8.0
dieback = 0.06

