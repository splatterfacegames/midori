# Jarrah forest floor on the Darling Scarp and plateau.
# Red-brown lateritic soil strewn with ironstone gravel (pisolite) and laterite boulders, deep leaf and bark
# litter, charred logs, sparse bracken and sedges. Stand zamia, grass trees and bull banksia on it from
# presets/species/wa_*. Notes and sources: docs/wa-flora.md

