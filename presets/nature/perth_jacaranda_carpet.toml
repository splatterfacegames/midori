# Suburban verge under a flowering jacaranda in November (planted, not native).
# Couch lawn on grey sand carpeted with fallen lilac flowers, with capeweed, leaf litter and old seed
# pods. Pair with presets/species/perth_jacaranda.toml --state flowering.
# Notes and sources: docs/wa-flora.md

[asset]
kind = "nature_patch"
name = "Perth Jacaranda Carpet"
units = "meters"

[patch]
