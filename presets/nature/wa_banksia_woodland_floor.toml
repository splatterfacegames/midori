# Banksia woodland floor on Bassendean sand (Swan Coastal Plain).
# Leached grey-white quartz sand, a thin litter of banksia leaves and old cones, scattered sedge tussocks
# and low heath. Stand grass trees, zamia, kangaroo paw and the banksias on it from presets/species/wa_*.
# Notes and sources: docs/wa-flora.md

