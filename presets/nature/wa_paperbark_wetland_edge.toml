# Edge of a paperbark swamp or lake on the Swan Coastal Plain.
# Dark peaty sand, seasonally wet, with dense rushes and sedges, papery bark litter and moss. Stand
# paperbarks, flooded gum, swamp banksia and jointed rush on it from presets/species/wa_*.
# Notes and sources: docs/wa-flora.md

[asset]
kind = "nature_patch"
name = "WA Paperbark Wetland Edge"
units = "meters"

[patch]
size = 16.0
seed = 6018
biome = "wetland_edge"
tags = ["wa_native", "wetland", "river_edge", "peat", "rush", "sedge"]

