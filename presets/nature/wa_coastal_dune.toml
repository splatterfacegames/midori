# Coastal foredune of the Perth beaches (Quindalup dunes).
# White-cream calcareous sand heaped into hummocks by spinifex, with dune scrub, limestone outcrop
# and driftwood. Stand beach spinifex, fanflower and daisybush on it from presets/species/wa_*.
# Notes and sources: docs/wa-flora.md

