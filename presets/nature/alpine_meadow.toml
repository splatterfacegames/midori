# Alpine wildflower meadow: knee-high grass and flowers read from a low camera, built as
# alpha-card clumps from the painted species atlas (textures/groundcover_cards.png).
# Hosts can drive density with [scatter_mask] (a road/verge mask, clearings round props);
# see integrations/usagi/README.md.
[asset]
kind = "nature_patch"
name = "Alpine Meadow"
units = "meters"

[patch]
size = 24.0
seed = 1802
biome = "alpine_meadow"
tags = ["alpine", "meadow", "grass", "flower", "cards"]

[soil]
profile = "silty_loam"
mound_scale = 0.07
mound_height = 0.18
mound_coverage = 0.8
relief_scale = 0.4
relief_strength = 0.22
wetness_coverage = 0.12

# The atlas every card layer samples: grass colours at the root and the blade tips.
[groundcover.card_atlas]
cell = 256
base = "#4f6426"
tips = ["#a3b04a", "#c4ba5c", "#879f3e", "#b9b066"]

# Knee-high grass: green, dry golden and seed-headed blades, densest and most even.
[[groundcover.layers]]
kind = "grass"
name = "alpine grass"
density = 0.74
coverage = 0.96
patch_scale = 0.09
patch_softness = 0.35
height = 0.52
width = 0.05
color_base = "#3e5220"
color_tip = "#b2b456"

[groundcover.layers.cards]
species = ["grass", "golden_grass", "oat_seeds"]
count = 5
card_width = 0.48
height_range = [0.65, 1.3]
lean_degrees = [6.0, 30.0]
loose = 0.16
normal_up = 0.75

# Wildflowers in drifts: oxeye daisies, buttercups, clover, bellflowers and yarrow.
[[groundcover.layers]]
kind = "flower"
name = "meadow flowers"
density = 0.62
coverage = 0.58
patch_scale = 0.16
patch_softness = 0.3
height = 0.44
width = 0.05
color_base = "#2e5529"
color_tip = "#f2f0b8"

[groundcover.layers.cards]
species = ["daisy", "buttercup", "clover", "bellflower", "yarrow"]
count = 4
card_width = 0.42
height_range = [0.75, 1.25]
lean_degrees = [4.0, 22.0]
loose = 0.14
normal_up = 0.7

# Tall accents, scattered: lupin spikes, ferns at the damp edges, a few poppies.
[[groundcover.layers]]
kind = "weed"
name = "meadow accents"
density = 0.30
coverage = 0.36
patch_scale = 0.13
patch_softness = 0.24
height = 0.72
width = 0.07
color_base = "#315c2b"
color_tip = "#7eb061"

[groundcover.layers.cards]
species = ["lupin", "fern", "poppy"]
count = 3
card_width = 0.44
height_range = [0.75, 1.3]
lean_degrees = [2.0, 16.0]
loose = 0.08
normal_up = 0.65

[wind]
strength = 0.6
speed = 2.0
direction_degrees = 35
gust_scale = 0.45
flutter = 0.7

[profiles.mobile]
tile_size = 16.0
terrain_resolution = 64
lod0_max_triangles = 120
lod1_max_triangles = 40
lod2_max_triangles = 8
lod0_max_distance = 6.0
lod1_max_distance = 16.0
lod2_max_distance = 34.0
material_slots = 1
max_instances_per_tile = 12288
max_instances_per_chunk = 3072
density_scale = 0.55
cull_start = 16.0
cull_end = 34.0
shadows = false
grass_collision = false
moss_collision = false

[profiles.console]
tile_size = 32.0
terrain_resolution = 128
lod0_max_triangles = 300
lod1_max_triangles = 100
lod2_max_triangles = 16
lod0_max_distance = 12.0
lod1_max_distance = 34.0
lod2_max_distance = 78.0
material_slots = 1
max_instances_per_tile = 12288
max_instances_per_chunk = 3072
density_scale = 0.95
cull_start = 34.0
cull_end = 78.0
shadows = false
grass_collision = false
moss_collision = false
