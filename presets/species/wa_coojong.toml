# Coojong / orange wattle (Acacia saligna)
# Fast weeping wattle of the Swan Coastal Plain and road verges: multi-stemmed short trunk,
# graceful weeping arch of long glaucous blue-green phyllodes, and golden spring ball flowers.
# Botanical notes and sources: docs/wa-flora.md

