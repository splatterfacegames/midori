[textures]
bark_prompt = "Bougainvillea thorny twisting pale brown woody climbing canes"
leaf_prompt = "Bougainvillea glabra glossy fresh green ovate leaves"
resolution = 1024
bark_style = "furrowed"
leaf_shape = "oval"
leaf_card = "cluster"
bark_color = [0.44, 0.38, 0.31]
leaf_color = [0.24, 0.43, 0.18]

[materials]
bark = "bougainvillea_bark"
foliage = "bougainvillea_foliage"
notes = "1024px glossy ovate leaf card + dedicated electric-magenta papery bract organ atlas."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 0.4
max = 2.5
step = 0.05

[[control_groups.controls]]
key = "bracts"
label = "Bract Clusters"
parameter = "inflorescence.count"
min = 0.0
max = 2400.0
step = 20.0

[lod]
preset = "balanced"

[platform]
target = "modern_pc"

# State: sunset-orange / terracotta bougainvillea cultivar
[states.orange]
species.name = "Bougainvillea (orange)"
inflorescence.color = [0.94, 0.32, 0.08]
inflorescence.color_tip = [0.98, 0.56, 0.18]
