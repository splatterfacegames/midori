# Bougainvillea (Bougainvillea glabra)
# Iconic 1980s-90s Perth limestone-wall, pergola and carport scrambling shrub/vine:
# sprawling thorny arching canes clothed in glossy bright green leaves and smothered all summer
# in electric magenta-purple papery bract clusters (or sunset-orange in [states.orange]).
# PLANTED EXOTIC (South America), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Bougainvillea"
scientific = "Bougainvillea glabra"
latin = "Bougainvillea glabra"
biome = "subtropical"
tags = ["perth_planted", "non_native", "shrub", "climber", "flowering", "summer"]

[generator]
family = "weber_penn"
notes = "3.2 m sprawling thorny arching mound smothered in magenta papery bracts; [states.orange] is sunset-orange."

[trunk]
