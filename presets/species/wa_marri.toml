# Marri (Corymbia calophylla)
# Big bloodwood of the jarrah forest and coastal plain: thick rambling limbs, a dense heavy crown,
# tessellated grey-brown bark bleeding red kino, and large urn-shaped 'honky nut' fruit.
# Botanical notes and sources: docs/wa-flora.md

[species]
