# Marri (Corymbia calophylla)
# Big bloodwood of the jarrah forest and Swan Coastal Plain: heavy spreading rambling limbs,
# tessellated grey-brown bark bleeding dark crimson kino, broad discolorous leaves, hanging honky nuts.
# Botanical notes and sources: docs/wa-flora.md

