# Illawarra flame tree (Brachychiton acerifolius)
# Dramatic civic and park specimen of Perth (Kings Park, Stirling Gardens, older avenues):
# smooth straight grey-green trunk, tall pyramidal-domed glossy lobed canopy; drops all leaves in
# late spring to erupt into a solid blaze of scarlet bell flowers.
# PLANTED EXOTIC in Perth (native to eastern Australian rainforests), not a WA native.
# Botanical notes and sources: docs/wa-flora.md

