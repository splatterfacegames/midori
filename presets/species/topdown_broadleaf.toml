# Top-down broadleaf (oak/beech-like) for RTS / top-down cameras.
# Game scale (1 unit = 1 m-ish tank hull): ~2.8 tall, ~2 across.

[species]
name = "Topdown Broadleaf"
scientific = "Quercus/Fagus (stylised)"
biome = "temperate"
tags = ["broadleaf", "deciduous", "topdown", "rts"]

[generator]
family = "weber_penn"

[trunk]
height = 2.1
height_variance = 0.12
radius = 0.10
taper = 0.80
taper_profile = "exponential"
curve = 6.0
curve_variance = 3.0
segments = 10

[branches.level1]
count = 6
count_variance = 1
length = 0.85
length_variance = 0.22
radius_ratio = 0.58
taper = 0.80
angle = 48.0
angle_variance = 15.0
rotation = 137.5
gravity = 0.05
curve = 20.0
curve_variance = 10.0
segments = 7

[branches.level2]
count = 5
count_variance = 1
length = 0.44
length_variance = 0.28
radius_ratio = 0.52
angle = 45.0
angle_variance = 15.0
rotation = 137.5
gravity = 0.0
curve = 20.0
segments = 4

[crown]
shape = "spherical"
offset = 0.38
density = 1.0
width_ratio = 1.2

[leaves]
count = 480
min_level = 1
size = 0.46
size_variance = 0.22
distribution = "both"
geometry = "canopy_card"
shape = "oval"
