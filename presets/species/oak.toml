angle = 58.0
angle_variance = 13.0
rotation = 137.5
gravity = -0.12
curve = 30.0
curve_variance = 18.0
segments = 15

[branches.level2]
count = 5
count_variance = 1
length = 2.4
length_variance = 0.22
radius_ratio = 0.54
radius_model = "ratio"
pipe_exponent = 2.25
taper = 0.78
