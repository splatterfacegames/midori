[crown]
shape = "spherical"
offset = 0.25
density = 1.0
width_ratio = 1.26

[leaves]
count = 2200
min_level = 2
size = 0.72
size_variance = 0.22
distribution = "both"
geometry = "cross_billboard"
shape = "oak_lobed"
up_influence = 0.34

[canopy]
normals = "canopy"
normal_blend = 0.86
up_bias = 0.28
clump_weight = 0.74
clump_level = 1
crown_fill = 0
shell = 0.24
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.20
hue_variation = 0.14
ao_strength = 0.52
roughness = 0.72

[textures]
bark_prompt = "English oak tree bark, deep diamond fissures, grey-brown corky ridges"
leaf_prompt = "Quercus robur oak branchlet spray with deeply lobed leaves and crisp venation"
resolution = 1024
bark_style = "furrowed"
leaf_shape = "lobed"
leaf_card = "cluster"
bark_color = [0.42, 0.36, 0.29]
leaf_color = [0.22, 0.43, 0.14]

[materials]
bark = "oak_bark"
foliage = "oak_leaf"
notes = "1024px procedural bark & botanical leaf cluster spray."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 3.0
max = 18.0
step = 0.1

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
