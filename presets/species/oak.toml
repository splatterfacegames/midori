[canopy]
normals = "canopy"
normal_blend = 0.85
up_bias = 0.22
clump_weight = 0.65
clump_level = 1
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.14
ao_strength = 0.52
roughness = 0.78

[textures]
bark_prompt = "English oak tree bark, deep fissures, grey-brown, coarse texture"
leaf_prompt = "Oak leaves with rounded lobes, dark green, visible venation"
resolution = 512
bark_style = "furrowed"
leaf_shape = "lobed"
leaf_card = "cluster"
bark_color = [0.36, 0.30, 0.24]
leaf_color = [0.22, 0.42, 0.14]

[materials]
bark = "oak_bark"
foliage = "oak_leaf"
notes = "Metadata placeholders only; texture/PBR asset pipeline is parked."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 3.0
max = 18.0
step = 0.1

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "balanced"

[platform]
target = "modern_pc"
