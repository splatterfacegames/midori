[crown]
shape = "spherical"
offset = 0.30
density = 1.0
width_ratio = 1.15

[leaves]
count = 2600
min_level = 2
size = 0.64
size_variance = 0.24
distribution = "both"
geometry = "cross_billboard"
shape = "oak_lobed"
