# Oak (Quercus robur)
# Broad, spreading crown with thick trunk. Irregular branching.
# Morphology note: docs/morphology/oak.md

[species]
name = "Oak"
scientific = "Quercus robur"
latin = "Quercus robur"
biome = "temperate"
tags = ["broadleaf", "deciduous", "spreading_crown"]

[generator]
family = "weber_penn"
notes = "Broadleaf tree using the current trunk/branch/leaf path."

[trunk]
height = 6.2
height_variance = 0.12
radius = 0.46
taper = 0.90
taper_profile = "smooth"
curve = 10.0
curve_variance = 5.0
curve_back = 4.0
segments = 8

[branches.level1]
count = 8
count_variance = 2
length = 4.6
length_variance = 0.2
radius_ratio = 0.54
taper = 0.82
taper_profile = "smooth"
angle = 56.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.14
curve = 20.0
curve_variance = 12.0
segments = 6

[branches.level2]
count = 5
count_variance = 1
length = 2.2
length_variance = 0.25
radius_ratio = 0.5
taper = 0.8
angle = 48.0
angle_variance = 15.0
rotation = 137.5
gravity = -0.12
curve = 22.0
curve_variance = 14.0
segments = 5

[branches.level3]
count = 4
count_variance = 1
length = 1.05
length_variance = 0.3
radius_ratio = 0.4
angle = 52.0
