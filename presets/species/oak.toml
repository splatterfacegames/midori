# Oak (Quercus robur)
# Broad, spreading crown with thick fluted trunk and muscular gnarled boughs.
# Morphology note: docs/morphology/oak.md

[species]
name = "Oak"
scientific = "Quercus robur"
latin = "Quercus robur"
biome = "temperate"
tags = ["broadleaf", "deciduous", "spreading_crown"]

[generator]
family = "weber_penn"
notes = "Broadleaf hero tree with muscular bough hierarchy and 1024px botanical sprays."

[trunk]
height = 6.5
height_variance = 0.12
radius = 0.58
taper = 0.74
taper_profile = "exponential"
curve = 20.0
curve_variance = 8.0
curve_back = 12.0
segments = 18

[branches.level1]
count = 8
count_variance = 2
length = 5.0
