# Oak (Quercus robur)
# Broad, spreading crown with thick trunk. Irregular branching.
# Morphology note: docs/morphology/oak.md

[species]
name = "Oak"
scientific = "Quercus robur"
latin = "Quercus robur"
biome = "temperate"
tags = ["broadleaf", "deciduous", "spreading_crown"]

[generator]
family = "weber_penn"
notes = "Broadleaf tree using the current trunk/branch/leaf path."

[trunk]
height = 6.0
height_variance = 0.15
radius = 0.45
taper = 0.75
curve = 8.0
curve_variance = 4.0
curve_back = 3.0
segments = 8

[branches.level1]
count = 6
count_variance = 2
length = 4.5
length_variance = 0.25
radius_ratio = 0.55
angle = 55.0
angle_variance = 20.0
rotation = 137.5
gravity = -0.15
curve = 25.0
curve_variance = 10.0
segments = 6

[branches.level2]
count = 5
count_variance = 2
length = 2.0
length_variance = 0.3
radius_ratio = 0.5
angle = 50.0
angle_variance = 18.0
rotation = 137.5
gravity = -0.2
curve = 30.0
curve_variance = 15.0
segments = 5

[branches.level3]
count = 4
count_variance = 2
length = 0.8
length_variance = 0.4
radius_ratio = 0.35
angle = 60.0
angle_variance = 25.0
rotation = 137.5
gravity = -0.35
curve = 45.0
curve_variance = 20.0
segments = 3

[crown]
shape = "spherical"
offset = 0.35
density = 1.0
width_ratio = 1.2

[leaves]
count = 3000
min_level = 2
size = 0.12
size_variance = 0.3
distribution = "both"
geometry = "polygon"
shape = "oak_lobed"
up_influence = 0.3

[textures]
bark_prompt = "English oak tree bark, deep fissures, grey-brown, coarse texture"
leaf_prompt = "Oak leaves with rounded lobes, dark green, visible venation"
resolution = 512
bark_style = "furrowed"
leaf_shape = "lobed"
leaf_card = "cluster"
bark_color = [0.36, 0.3, 0.25]
leaf_color = [0.17, 0.35, 0.12]

[materials]
bark = "oak_bark"
foliage = "oak_leaf"
notes = "Metadata placeholders only; texture/PBR asset pipeline is parked."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 3.0
max = 18.0
step = 0.1

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "balanced"

[platform]
target = "modern_pc"
