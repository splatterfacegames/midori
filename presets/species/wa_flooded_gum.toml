[branches.level4]
count = 2
count_variance = 1
length = 0.85
length_variance = 0.22
radius_ratio = 0.48
radius_model = "ratio"
taper = 0.78
taper_profile = "compound"
angle = 40.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.22
curve = 10.0
curve_variance = 14.0
segments = 4

[crown]
shape = "hemispherical"
offset = 0.30
density = 0.86
width_ratio = 1.38

[leaves]
count = 2200
min_level = 3
size = 0.92
size_variance = 0.24
distribution = "both"
geometry = "cross_billboard"
shape = "sickle"
up_influence = -0.46

[canopy]
normals = "canopy"
normal_blend = 0.74
up_bias = 0.24
clump_weight = 0.64
clump_level = 1
crown_fill = 0
shell = 0.12
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.19
hue_variation = 0.12
ao_strength = 0.44
billboard_lod_compensation = true
roughness = 0.76

[textures]
bark_prompt = "Flooded gum lower bark, rough dark grey persistent box bark"
leaf_prompt = "Eucalyptus rudis leaves, dull blue-grey-green hanging sickle leaves"
resolution = 1024
bark_style = "tessellated"
leaf_shape = "sickle"
leaf_card = "cluster"
bark_color = [0.33, 0.32, 0.30]
upper_bark_style = "patchy"
upper_bark_color = [0.73, 0.72, 0.68]
upper_bark_patch_colors = [[0.58, 0.59, 0.57], [0.80, 0.77, 0.71]]
bark_transition_height = 3.8
bark_transition_span = 1.2
leaf_color = [0.41, 0.48, 0.38]
leaf_underside_color = [0.52, 0.57, 0.48]
leaf_dead_fraction = 0.09
leaf_dead_color = [0.58, 0.47, 0.28]

[materials]
bark = "flooded_gum_bark"
foliage = "flooded_gum_foliage"
notes = "1024px half-barked trunk/upper limbs + dull blue-grey sickle leaf card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 4.0
max = 22.0
step = 0.5

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.6
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
