rotation = 137.5
gravity = -0.06
curve = -18.0
curve_variance = 22.0
segments = 10

[branches.level3]
count = 3
count_variance = 1
length = 1.7
length_variance = 0.22
radius_ratio = 0.48
radius_model = "ratio"
taper = 0.78
