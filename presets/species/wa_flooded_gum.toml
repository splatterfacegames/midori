# Flooded gum (Eucalyptus rudis)
# Eucalypt of river flats and swamp margins: a short, often leaning trunk in rough dark grey box bark
# and a wide, rather untidy spreading crown, frequently thinned by leaf miners in spring.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Flooded Gum"
scientific = "Eucalyptus rudis"
latin = "Eucalyptus rudis"
biome = "mediterranean"
tags = ["wa_native", "eucalypt", "river_edge", "wetland", "swan_coastal_plain", "evergreen"]

[generator]
family = "weber_penn"
notes = "Riverbank form (about 15 m). The smooth upper limbs are not expressible: one bark map covers the whole tree."

[trunk]
height = 8.5
height_variance = 0.16
radius = 0.55
taper = 0.72
taper_profile = "exponential"
curve = 30.0
curve_variance = 14.0
curve_back = 26.0
segments = 20

[branches.level1]
count = 8
count_variance = 2
length = 7.4
length_variance = 0.22
radius_ratio = 0.56
radius_model = "ratio"
taper = 0.78
taper_profile = "exponential"
angle = 60.0
angle_variance = 16.0
rotation = 137.5
gravity = -0.05
curve = 28.0
curve_variance = 26.0
segments = 14

[branches.level2]
count = 5
count_variance = 1
length = 3.6
length_variance = 0.22
radius_ratio = 0.54
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 52.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.05
curve = -18.0
curve_variance = 22.0
segments = 10

[branches.level3]
count = 4
count_variance = 1
length = 1.7
length_variance = 0.22
radius_ratio = 0.46
radius_model = "ratio"
taper = 0.78
taper_profile = "compound"
angle = 48.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.12
curve = 14.0
curve_variance = 18.0
segments = 7

[crown]
shape = "spherical"
offset = 0.26
density = 1.0
width_ratio = 1.3

[leaves]
count = 2300
min_level = 2
size = 1.1
size_variance = 0.22
distribution = "both"
geometry = "cross_billboard"
shape = "sickle"
up_influence = -0.4

[canopy]
normals = "canopy"
normal_blend = 0.84
up_bias = 0.28
clump_weight = 0.7
clump_level = 1
crown_fill = 0
shell = 0.2
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.12
ao_strength = 0.5
roughness = 0.72

[textures]
bark_prompt = "Flooded gum bark, rough, dark grey, box-type, persistent on trunk and large limbs"
leaf_prompt = "Eucalyptus rudis leaves, dull grey-green, lanceolate to ovate"
resolution = 1024
bark_style = "tessellated"
leaf_shape = "sickle"
leaf_card = "cluster"
bark_color = [0.38, 0.37, 0.35]
leaf_color = [0.28, 0.4, 0.22]

[materials]
bark = "flooded_gum_bark"
foliage = "flooded_gum_foliage"
notes = "1024px procedural bark and leaf card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 4.0
max = 60.0
step = 0.5

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
