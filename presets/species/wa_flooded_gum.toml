# Flooded gum (Eucalyptus rudis)
# Eucalypt of Swan/Canning river flats and wetlands: short leaning trunk in rough dark grey box
# bark transitioning to smooth pale silvery-grey upper limbs, carrying a wide untidy crown.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Flooded Gum"
scientific = "Eucalyptus rudis"
latin = "Eucalyptus rudis"
biome = "mediterranean"
tags = ["wa_native", "eucalypt", "river_edge", "wetland", "swan_coastal_plain", "evergreen"]

[generator]
family = "weber_penn"
notes = "Half-barked riverbank tree (rough dark lower trunk -> smooth pale upper limbs) with level-4 twigs."

[trunk]
height = 14.0
height_variance = 0.16
radius = 0.68
taper = 0.70
taper_profile = "exponential"
curve = 26.0
curve_variance = 14.0
curve_back = 22.0
segments = 22
buttress = 1.5

[branches.level1]
count = 8
count_variance = 2
length = 7.8
length_variance = 0.24
radius_ratio = 0.56
radius_model = "ratio"
taper = 0.76
taper_profile = "exponential"
angle = 62.0
angle_variance = 18.0
rotation = 137.5
gravity = -0.06
curve = 26.0
curve_variance = 24.0
segments = 14

[branches.level2]
count = 4
count_variance = 1
