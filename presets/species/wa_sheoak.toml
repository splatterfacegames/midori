# Common sheoak (Allocasuarina fraseriana)
# Sheoak of the jarrah forest and banksia woodland: erect trunk in reddish-brown deeply furrowed
# fibrous bark, airy see-through crown of drooping khaki-olive jointed branchlets, and woody cones.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Common Sheoak"
scientific = "Allocasuarina fraseriana"
