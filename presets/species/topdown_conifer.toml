# Top-down conifer (star-whorled alpine spruce/fir) for isometric ARPG & overhead RTS cameras.
# Interlocking 5-spoke evergreen whorls with distichous lateral feathering and sunlit bud tips.

[species]
name = "Topdown Conifer"
scientific = "Picea/Abies (stylised)"
biome = "temperate"
tags = ["conifer", "evergreen", "topdown", "rts"]

[generator]
family = "weber_penn"

[trunk]
height = 6.2
height_variance = 0.10
radius = 0.28
taper = 0.88
taper_profile = "exponential"
curve = 9.0
curve_variance = 4.0
curve_back = 10.0
segments = 16

[branches.level1]
# 7 interlocking 5-spoke whorls (rotation = 72 deg) forming a 10-pointed evergreen rosette from above
count = 35
count_variance = 2
length = 2.35
length_variance = 0.10
radius_ratio = 0.42
taper = 0.84
taper_profile = "exponential"
angle = 76.0
angle_variance = 5.0
rotation = 72.0
gravity = -0.10
curve = -18.0
curve_variance = 5.0
segments = 10

[branches.level2]
# Distichous left/right horizontal feather shoots (rotation = 180 deg) shingling each spruce bough
count = 4
count_variance = 1
length = 0.86
length_variance = 0.14
radius_ratio = 0.48
taper = 0.82
angle = 54.0
angle_variance = 8.0
rotation = 180.0
gravity = -0.04
curve = -10.0
curve_variance = 5.0
segments = 5

[crown]
shape = "conical"
offset = 0.14
density = 1.0
width_ratio = 1.04

[leaves]
count = 1650
min_level = 1
size = 0.68
size_variance = 0.14
distribution = "both"
geometry = "cross_billboard"
shape = "needle"
up_influence = 0.64

[canopy]
normals = "canopy"
normal_blend = 0.84
up_bias = 0.56
clump_weight = 0.52
clump_level = 1
crown_fill = 0
shell = 0.18
card_tilt = 14.0
card_max_angle = 34.0
card_roll = "radial"
card_offset = 0.24
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.12
ao_strength = 0.54
card_scale_by_clump = 0.0
roughness = 0.76

[textures]
resolution = 1024
bark_style = "plated"
leaf_shape = "needle"
leaf_card = "frond"
bark_color = [0.42, 0.26, 0.17]
leaf_color = [0.17, 0.39, 0.17]

[lod]
preset = "custom"

[[lod.levels]]
index = 0
name = "LOD0"
target_triangles = 28000
max_triangles = 52000
branch_levels = 2
leaf_geometry = "cross_billboard"
leaf_reduction = 1.0
ring_resolution = [22, 12, 6, 4]
screen_height = 0.22

[[lod.levels]]
index = 1
name = "LOD1"
target_triangles = 4500
max_triangles = 8000
branch_levels = 1
leaf_geometry = "canopy_card"
leaf_reduction = 0.42
ring_resolution = [10, 6, 4, 3]
screen_height = 0.06

[[lod.levels]]
index = 2
name = "LOD2"
target_triangles = 600
max_triangles = 1200
branch_levels = 1
leaf_geometry = "none"
leaf_reduction = 0.0
ring_resolution = [6, 4, 3, 3]
screen_height = 0.02
crown_impostor = true

[platform]
target = "modern_pc"
