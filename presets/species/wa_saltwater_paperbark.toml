# Saltwater paperbark (Melaleuca cuticularis)
# Low wind-sculpted paperbark of the Swan/Canning estuary edge and salt lakes: stark chalk-white
# peeling papery bark on rigid, tortuously twisted zig-zag limbs with sparse dusty sage tufts.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Saltwater Paperbark"
scientific = "Melaleuca cuticularis"
latin = "Melaleuca cuticularis"
biome = "mediterranean"
tags = ["wa_native", "paperbark", "river_edge", "saline", "swan_coastal_plain", "evergreen"]

[generator]
family = "weber_penn"
notes = "Low sculptural 3.5-4.5 m multi-stem form with blinding white twisted limbs clearly exposed."

