roughness = 0.78

[textures]
bark_prompt = "Saltwater paperbark, stark chalk-white papery bark peeling in crisp sheets"
leaf_prompt = "Melaleuca cuticularis tiny opposite leaves in sparse dusty blue-sage tufts"
resolution = 1024
bark_style = "papery"
leaf_shape = "paperbark"
leaf_card = "cluster"
bark_color = [0.93, 0.91, 0.88]
leaf_color = [0.39, 0.47, 0.41]
leaf_underside_color = [0.54, 0.60, 0.55]
bark_patch_colors = [[0.78, 0.72, 0.64], [0.87, 0.84, 0.79]]

[materials]
bark = "saltwater_paperbark_bark"
foliage = "saltwater_paperbark_foliage"
notes = "1024px stark white papery bark and fine Melaleuca sprig card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 1.5
max = 7.0
step = 0.1

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.6
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
