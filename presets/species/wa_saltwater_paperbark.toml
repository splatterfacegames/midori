[crown]
shape = "hemispherical"
offset = 0.34
density = 0.76
width_ratio = 1.38

[leaves]
count = 1200
min_level = 2
size = 0.44
size_variance = 0.20
distribution = "endpoint"
geometry = "cross_billboard"
shape = "paperbark"
