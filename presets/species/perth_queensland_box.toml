# Queensland box / brush box (Lophostemon confertus)
# The ubiquitous suburban verge tree: a straight trunk, brown scaly bark below and smooth pinkish limbs above,
# and a very dense dark dome of glossy leaves clustered at the twig ends.
# PLANTED EXOTIC (eastern Australia), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Queensland Box"
scientific = "Lophostemon confertus"
latin = "Lophostemon confertus"
biome = "subtropical"
tags = ["perth_planted", "non_native", "street_tree", "evergreen"]

[generator]
family = "weber_penn"
notes = "Free-grown street tree of about 12 m. The lopped state is the flat, cut-back tree under power lines."

[trunk]
height = 7.0
height_variance = 0.12
radius = 0.36
taper = 0.72
taper_profile = "exponential"
curve = 12.0
curve_variance = 7.0
curve_back = 12.0
segments = 18

[branches.level1]
count = 10
count_variance = 2
length = 4.6
length_variance = 0.22
radius_ratio = 0.54
radius_model = "ratio"
taper = 0.78
taper_profile = "exponential"
angle = 52.0
angle_variance = 14.0
rotation = 137.5
gravity = 0.02
curve = 20.0
curve_variance = 20.0
segments = 13

[branches.level2]
count = 6
count_variance = 1
length = 2.2
length_variance = 0.22
radius_ratio = 0.54
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 48.0
angle_variance = 14.0
rotation = 137.5
gravity = 0.02
curve = -14.0
curve_variance = 18.0
segments = 9

[branches.level3]
count = 5
count_variance = 1
length = 1.0
length_variance = 0.22
radius_ratio = 0.46
radius_model = "ratio"
taper = 0.78
taper_profile = "compound"
angle = 44.0
angle_variance = 14.0
rotation = 137.5
gravity = 0.02
curve = 12.0
curve_variance = 18.0
segments = 6

[crown]
shape = "spherical"
offset = 0.32
density = 1.0
width_ratio = 1.1

[leaves]
count = 3600
min_level = 2
size = 0.8
size_variance = 0.22
distribution = "endpoint"
geometry = "cross_billboard"
shape = "pointed"
up_influence = 0.15

[canopy]
normals = "canopy"
normal_blend = 0.84
up_bias = 0.28
clump_weight = 0.7
clump_level = 1
crown_fill = 0
shell = 0.2
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.12
ao_strength = 0.58
roughness = 0.5

[textures]
bark_prompt = "Brush box bark, brown, rough and scaly on the trunk"
leaf_prompt = "Lophostemon confertus leaves, elliptic, leathery, dark glossy green, in whorls at twig ends"
resolution = 1024
bark_style = "plated"
leaf_shape = "pointed"
leaf_card = "cluster"
seed = 1968
bark_color = [0.44, 0.34, 0.27]
leaf_color = [0.15, 0.31, 0.12]

[materials]
bark = "queensland_box_bark"
foliage = "queensland_box_foliage"
notes = "1024px procedural bark and leaf card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 2.0
max = 14.0
step = 0.1

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"

# State: lopped under power lines: short trunk, stubby limbs, flat dense regrowth
[states.lopped]
species.name = "Queensland Box (lopped)"
trunk.height = 3.4
trunk.radius = 0.4
crown.shape = "hemispherical"
crown.offset = 0.45
crown.width_ratio = 1.5
branches.level1.length = 2.3
branches.level1.angle = 66.0
branches.level1.radius_ratio = 0.62
branches.level2.length = 1.3
branches.level3.length = 0.8
leaves.size = 0.7
leaves.count = 3000
