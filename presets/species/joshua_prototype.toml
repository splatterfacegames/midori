# Joshua Tree Prototype (Yucca brevifolia)
# Minimal dichotomous generator preset. Morphology note: docs/morphology/joshua-tree.md

[species]
name = "Joshua Prototype"
scientific = "Yucca brevifolia"
latin = "Yucca brevifolia"
biome = "desert"
tags = ["yucca", "desert", "dichotomous", "prototype"]

[generator]
family = "dichotomous"
notes = "Second-family prototype using terminal fork grammar and shared Tree output."

[trunk]
height = 2.9
height_variance = 0.12
radius = 0.31
taper = 0.16
taper_profile = "smooth"
curve = 10.0
curve_variance = 5.0
curve_back = 3.0
segments = 7

[branches.level1]
count = 3
count_variance = 1
length = 1.85
length_variance = 0.18
radius_ratio = 0.94
radius_model = "pipe"
pipe_exponent = 3.2
taper = 0.16
taper_profile = "smooth"
angle = 36.0
angle_variance = 8.0
rotation = 137.5
gravity = 0.24
curve = 22.0
curve_variance = 9.0
segments = 6

[branches.level2]
count = 2
count_variance = 1
length = 1.35
length_variance = 0.2
radius_ratio = 0.92
radius_model = "pipe"
pipe_exponent = 3.2
taper = 0.18
taper_profile = "smooth"
angle = 34.0
angle_variance = 9.0
rotation = 115.0
gravity = 0.32
curve = 20.0
curve_variance = 8.0
segments = 5

[branches.level3]
count = 2
count_variance = 0
length = 0.95
length_variance = 0.22
radius_ratio = 0.90
radius_model = "pipe"
pipe_exponent = 3.2
taper = 0.20
taper_profile = "smooth"
angle = 32.0
angle_variance = 10.0
rotation = 125.0
gravity = 0.38
curve = 16.0
curve_variance = 6.0
segments = 4

[crown]
shape = "columnar"
offset = 0.65
density = 1.0
width_ratio = 1.0

[leaves]
count = 280
min_level = 2
size = 0.94
size_variance = 0.18
distribution = "endpoint"
geometry = "cross_billboard"
shape = "needle"
up_influence = 0.42

[canopy]
normals = "canopy"
normal_blend = 0.72
up_bias = 0.30
clump_weight = 0.82
clump_level = 3
vertex_color = "tint_ao"
tint_variation = 0.16
hue_variation = 0.10
ao_strength = 0.36
roughness = 0.82

[textures]
resolution = 512
bark_style = "furrowed"
leaf_shape = "needle"
leaf_card = "puff"
bark_color = [0.43, 0.36, 0.28]
leaf_color = [0.34, 0.43, 0.21]

[materials]
bark = "joshua_stem"
foliage = "joshua_rosette"
notes = "Metadata placeholders only; texture/PBR asset pipeline is parked."

[[control_groups]]
key = "forks"
label = "Forks"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 2.5
max = 8.0
step = 0.1

[[control_groups.controls]]
key = "fork_angle"
label = "Fork Angle"
parameter = "branches.level1.angle"
min = 20.0
max = 70.0
step = 1.0

[lod]
preset = "balanced"

[platform]
target = "modern_pc"
