# Joshua Tree Prototype (Yucca brevifolia)
# Dichotomous Mojave desert yucca with fibrous furrowed limbs and terminal bayonet rosettes.
# Morphology note: docs/morphology/joshua-tree.md

[species]
name = "Joshua Prototype"
scientific = "Yucca brevifolia"
latin = "Yucca brevifolia"
biome = "desert"
tags = ["yucca", "desert", "dichotomous", "prototype"]

[generator]
family = "dichotomous"
notes = "Second-family generator using terminal fork grammar and shared Tree output."

[trunk]
height = 3.0
height_variance = 0.12
radius = 0.32
taper = 0.26
taper_profile = "smooth"
curve = 18.0
curve_variance = 7.0
curve_back = 10.0
segments = 16

[branches.level1]
count = 3
count_variance = 1
length = 1.90
length_variance = 0.18
radius_ratio = 0.76
radius_model = "ratio"
pipe_exponent = 3.2
taper = 0.24
taper_profile = "smooth"
angle = 36.0
angle_variance = 9.0
rotation = 137.5
gravity = 0.14
curve = 28.0
curve_variance = 14.0
segments = 12

[branches.level2]
count = 2
count_variance = 1
length = 1.38
length_variance = 0.20
radius_ratio = 0.78
radius_model = "ratio"
pipe_exponent = 3.2
taper = 0.24
taper_profile = "smooth"
angle = 34.0
angle_variance = 10.0
rotation = 115.0
gravity = 0.18
curve = 26.0
curve_variance = 12.0
segments = 10

[branches.level3]
count = 2
count_variance = 0
length = 0.96
length_variance = 0.22
radius_ratio = 0.80
radius_model = "ratio"
pipe_exponent = 3.2
taper = 0.24
taper_profile = "smooth"
angle = 32.0
angle_variance = 10.0
rotation = 125.0
gravity = 0.22
curve = 22.0
curve_variance = 10.0
segments = 8

[crown]
shape = "columnar"
offset = 0.65
density = 1.0
width_ratio = 1.0

[leaves]
count = 420
min_level = 1
size = 1.08
size_variance = 0.18
distribution = "endpoint"
geometry = "cross_billboard"
shape = "needle"
up_influence = 0.44

[canopy]
normals = "canopy"
normal_blend = 0.74
up_bias = 0.32
clump_weight = 0.84
clump_level = 3
crown_fill = 0
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.16
hue_variation = 0.10
ao_strength = 0.38
roughness = 0.80

[textures]
resolution = 1024
bark_style = "furrowed"
leaf_shape = "needle"
leaf_card = "puff"
bark_color = [0.43, 0.36, 0.28]
leaf_color = [0.34, 0.44, 0.21]

[materials]
bark = "joshua_stem"
foliage = "joshua_rosette"
notes = "1024px fibrous stem bark and yucca bayonet rosette card."

[[control_groups]]
key = "forks"
label = "Forks"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 2.5
max = 8.0
step = 0.1

[[control_groups.controls]]
key = "fork_angle"
label = "Fork Angle"
parameter = "branches.level1.angle"
min = 20.0
max = 70.0
step = 1.0

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
