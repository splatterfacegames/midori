# Joshua Tree Prototype (Yucca brevifolia)
# Minimal dichotomous generator preset. Morphology note: docs/morphology/joshua-tree.md

[species]
name = "Joshua Prototype"
scientific = "Yucca brevifolia"
latin = "Yucca brevifolia"
biome = "desert"
tags = ["yucca", "desert", "dichotomous", "prototype"]

[generator]
family = "dichotomous"
notes = "Second-family prototype using terminal fork grammar and shared Tree output."

[trunk]
height = 4.5
height_variance = 0.12
radius = 0.32
taper = 0.55
curve = 3.0
curve_variance = 1.5
curve_back = 0.0
segments = 5

[branches.level1]
count = 2
count_variance = 0
length = 2.1
length_variance = 0.18
radius_ratio = 0.85
radius_model = "pipe"
pipe_exponent = 2.0
taper = 0.45
taper_profile = "smooth"
angle = 38.0
angle_variance = 8.0
rotation = 180.0
gravity = -0.05
curve = 10.0
curve_variance = 4.0
segments = 4

[branches.level2]
count = 2
count_variance = 0
length = 1.25
length_variance = 0.2
radius_ratio = 0.82
radius_model = "pipe"
pipe_exponent = 2.0
taper = 0.5
taper_profile = "smooth"
angle = 42.0
angle_variance = 8.0
rotation = 180.0
gravity = 0.0
curve = 8.0
curve_variance = 4.0
segments = 3

[branches.level3]
count = 2
count_variance = 0
length = 0.7
length_variance = 0.25
radius_ratio = 0.78
radius_model = "pipe"
pipe_exponent = 2.0
taper = 0.55
taper_profile = "smooth"
angle = 45.0
angle_variance = 10.0
rotation = 180.0
gravity = 0.05
curve = 6.0
curve_variance = 3.0
segments = 2

[crown]
shape = "columnar"
offset = 0.75
density = 0.85
width_ratio = 0.8

[leaves]
count = 360
min_level = 2
size = 0.18
size_variance = 0.25
distribution = "endpoint"
geometry = "polygon"
shape = "needle"
up_influence = 0.8

[materials]
bark = "joshua_stem"
foliage = "joshua_rosette"
notes = "Metadata placeholders only; texture/PBR asset pipeline is parked."

[[control_groups]]
key = "forks"
label = "Forks"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 2.5
max = 8.0
step = 0.1

[[control_groups.controls]]
key = "fork_angle"
label = "Fork Angle"
parameter = "branches.level1.angle"
min = 20.0
max = 70.0
step = 1.0

[lod]
preset = "balanced"

[platform]
target = "modern_pc"
