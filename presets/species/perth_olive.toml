# Olive (Olea europaea)
# Backyard and front-garden tree of Perth's post-war migrant suburbs: a short gnarled grey trunk and a
# rounded crown of small narrow leaves, grey-green above and silver beneath.
# PLANTED EXOTIC (Mediterranean), not a Western Australian native. Perth-specific sourcing was not found; see docs.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Olive"
scientific = "Olea europaea"
latin = "Olea europaea"
biome = "mediterranean"
tags = ["perth_planted", "non_native", "garden_tree", "evergreen", "grey_foliage"]

[generator]
family = "weber_penn"
notes = "Garden tree of about 6 m."

[trunk]
