# Olive (Olea europaea)
# Iconic front-garden and backyard tree of Perth's post-war Italian/Greek/Croatian suburbs
# (Northbridge, Fremantle, Balcatta, Spearwood, Bassendean) and colonial parklands: gnarled twisting
# grey trunk and shimmering rounded crown of narrow leaves, grey-green above and silvery-white beneath.
# PLANTED EXOTIC (Mediterranean), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Olive"
scientific = "Olea europaea"
latin = "Olea europaea"
biome = "mediterranean"
tags = ["perth_planted", "non_native", "garden_tree", "evergreen", "grey_foliage"]

