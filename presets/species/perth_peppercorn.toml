# Peppercorn tree (Schinus molle)
# Old farmyard, school and railway-station shade tree: a gnarled, burled trunk and a wide crown of weeping
# branchlets hung with fine feathery leaves and strings of pink-red peppercorns.
# PLANTED EXOTIC (South America), not a Western Australian native. Perth-specific sourcing was not found; see docs.
# Botanical notes and sources: docs/wa-flora.md

