# Peppercorn tree (Schinus molle)
# Heritage shade tree of Guildford, Fremantle, old Perth railway stations and 1980s-90s schoolyards
# (widely planted across WA since settler-colonial times prior to late-1990s weed phase-out):
# gnarled burled trunk, wide cascading weeping feathery curtains, and hanging rose-pink peppercorn strings.
# PLANTED EXOTIC (South America), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Peppercorn Tree"
scientific = "Schinus molle"
latin = "Schinus molle"
biome = "subtropical"
tags = ["perth_planted", "non_native", "shade_tree", "evergreen", "weeping", "berries"]

[generator]
