# Bull banksia (Banksia grandis)
# Understorey tree of the jarrah forest: a short stout crooked trunk, architectural limbs,
# unmistakable giant triangular-notched leaves in whorled rosettes, and huge pale yellow spikes.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Bull Banksia"
scientific = "Banksia grandis"
latin = "Banksia grandis"
biome = "mediterranean"
tags = ["wa_native", "banksia", "evergreen", "jarrah_forest", "darling_scarp", "understorey"]

[generator]
