# Bull banksia (Banksia grandis)
# Understorey tree of the jarrah forest: a short stout crooked trunk, enormous leaves cut to the midrib into
# triangular lobes, crowded at the branch ends, and pale yellow spikes up to 40 cm tall.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Bull Banksia"
scientific = "Banksia grandis"
latin = "Banksia grandis"
biome = "mediterranean"
tags = ["wa_native", "banksia", "evergreen", "jarrah_forest", "darling_scarp", "understorey"]

[generator]
