[crown]
shape = "conical"
offset = 0.25
density = 0.85
width_ratio = 0.6

[leaves]
count = 5000
min_level = 2
size = 0.08
size_variance = 0.15
distribution = "along_branch"
geometry = "billboard"
shape = "needle"
