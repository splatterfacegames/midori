# Pine (Pinus sylvestris)
# Conical crown, whorled branching, needles instead of broad leaves.

[species]
name = "Pine"
scientific = "Pinus sylvestris"

[trunk]
height = 10.0
height_variance = 0.1
radius = 0.35
taper = 0.85
curve = 3.0
curve_variance = 2.0
curve_back = 0.0
segments = 10

[branches.level1]
count = 8
count_variance = 1
length = 3.0
length_variance = 0.15
radius_ratio = 0.4
angle = 75.0
angle_variance = 10.0
rotation = 137.5
gravity = 0.1
curve = 15.0
curve_variance = 5.0
segments = 5

[branches.level2]
count = 5
count_variance = 1
length = 1.2
length_variance = 0.2
radius_ratio = 0.45
angle = 45.0
angle_variance = 12.0
rotation = 137.5
gravity = 0.05
curve = 10.0
segments = 3

[branches.level3]
count = 4
count_variance = 1
length = 0.4
length_variance = 0.3
radius_ratio = 0.35
angle = 40.0
gravity = 0.0
curve = 5.0
