# Swamp sheoak (Casuarina obesa)
# Sheoak of the brackish river edge and salt lakes: grey corky fissured bark, a narrow upright crown
# and dull blue-grey drooping branchlets. Suckers into thickets along the Swan and Canning.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Swamp Sheoak"
scientific = "Casuarina obesa"
latin = "Casuarina obesa"
biome = "mediterranean"
tags = ["wa_native", "sheoak", "river_edge", "saline", "swan_coastal_plain", "evergreen"]

[generator]
