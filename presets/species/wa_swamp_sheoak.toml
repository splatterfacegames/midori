# Swamp sheoak (Casuarina obesa)
# Riverbank and salt-lake sheoak: multi-stem suckering thicket habit in cool grey corky fissured bark,
# narrow weeping spire silhouette, and airy dusty blue-grey-green drooping branchlets.
# Botanical notes and sources: docs/wa-flora.md

