# Swamp banksia (Banksia littoralis)
# Banksia of damp sand and swamp margins: taller and straighter than the sandplain banksias, with rough
# crumbly grey bark, narrow whorled leaves and yellow spikes in autumn and winter.
# Botanical notes and sources: docs/wa-flora.md

