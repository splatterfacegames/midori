# Swamp banksia (Banksia littoralis)
# Banksia of damp sand and swamp margins: taller and straighter than the sandplain banksias,
# with crumbly grey bark, fine whorled wetland-sage leaves and golden-yellow spikes.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Swamp Banksia"
scientific = "Banksia littoralis"
latin = "Banksia littoralis"
biome = "mediterranean"
tags = ["wa_native", "banksia", "evergreen", "wetland", "swan_coastal_plain"]

[generator]
