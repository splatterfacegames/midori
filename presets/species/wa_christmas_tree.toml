offset = 0.3
density = 1.0
width_ratio = 1.2

[leaves]
count = 1500
min_level = 2
size = 0.6
size_variance = 0.22
distribution = "both"
geometry = "cross_billboard"
shape = "willow"
up_influence = 0.15

[inflorescence]
kind = "cluster"
count = 1300
min_level = 2
placement = "endpoint"
orientation = "branch"
length = 0.62
width = 0.62
size_variance = 0.25
color = [0.97, 0.6, 0.06]
