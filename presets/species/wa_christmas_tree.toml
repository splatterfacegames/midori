hue_variation = 0.12
ao_strength = 0.5
roughness = 0.72

[textures]
bark_prompt = "Nuytsia floribunda bark, rough, grey-brown, coarsely fissured"
leaf_prompt = "Nuytsia leaves, narrow lanceolate, dull blue-green, thick"
resolution = 1024
bark_style = "furrowed"
leaf_shape = "willow"
leaf_card = "cluster"
seed = 1903
bark_color = [0.42, 0.37, 0.31]
leaf_color = [0.27, 0.37, 0.22]

[materials]
bark = "christmas_tree_bark"
foliage = "christmas_tree_foliage"
notes = "2x2 foliage atlas: leaf spray, orange flower panicle, spent panicle."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 2.0
max = 9.0
step = 0.1

[[control_groups.controls]]
key = "flowers"
label = "Flower Clusters"
parameter = "inflorescence.count"
min = 0.0
max = 2000.0
step = 10.0

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"

# State: February to September: no flowers
[states.out_of_flower]
species.name = "WA Christmas Tree (out of flower)"
inflorescence.count = 0
leaves.count = 2400
