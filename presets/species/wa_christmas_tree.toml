# WA Christmas tree / moodjar (Nuytsia floribunda)
# Root-parasitic tree of the Swan Coastal Plain: stout rough gnarled trunk, brittle irregular
# spreading limbs, dull yellow-olive narrow leaves, smothered in blazing golden-orange flowers in December.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "WA Christmas Tree"
scientific = "Nuytsia floribunda"
latin = "Nuytsia floribunda"
biome = "mediterranean"
tags = ["wa_native", "mistletoe_family", "banksia_woodland", "swan_coastal_plain", "flowering", "summer"]

[generator]
family = "weber_penn"
notes = "Default is December peak orange blossom on a dedicated organ material; out_of_flower is its brittle sparse form."

