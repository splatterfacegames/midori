# WA Christmas tree / moodjar (Nuytsia floribunda)
# Root-parasitic tree of the sandplain: stout rough trunk, brittle spreading limbs, dull narrow leaves,
# and from October to January a crown smothered in vivid orange flowers.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "WA Christmas Tree"
scientific = "Nuytsia floribunda"
latin = "Nuytsia floribunda"
biome = "mediterranean"
tags = ["wa_native", "mistletoe_family", "banksia_woodland", "swan_coastal_plain", "flowering", "summer"]

[generator]
family = "weber_penn"
notes = "Default is the December tree in full flower; the out_of_flower state is the rest of the year."

[trunk]
height = 4.6
height_variance = 0.16
radius = 0.36
taper = 0.7
taper_profile = "exponential"
curve = 26.0
curve_variance = 12.0
curve_back = 24.0
segments = 18

[branches.level1]
