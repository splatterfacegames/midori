[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 2.5
max = 10.0
step = 0.1

[[control_groups.controls]]
key = "flowers"
label = "Flower Clusters"
parameter = "inflorescence.count"
min = 0.0
max = 2000.0
step = 10.0

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"

# State: February to September: brittle sparse olive-grey crown without flowers
[states.out_of_flower]
species.name = "WA Christmas Tree (out of flower)"
inflorescence.count = 0
leaves.count = 1900
