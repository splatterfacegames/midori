# Red tingle (Eucalyptus jacksonii)
# Ancient giant of the Walpole wilderness: enormous fluted buttressed base with a charred
# walk-through fire hollow, deep red-brown stringy bark, massive bole and dense high crown.
# Botanical notes and sources: docs/wa-flora.md

