# Modong / stout paperbark (Melaleuca preissiana)
# The tall stout paperbark of seasonal damplands on the Swan Coastal Plain: a thick, gnarled trunk
# in creamy-buff layered papery bark, broad billowing olive-sage crown, and creamy summer flower spikes.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Modong"
