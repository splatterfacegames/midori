# Thick-leaved fanflower (Scaevola crassifolia)
# Low wind-pruned cushion shrub of Perth's foredunes and limestone coast: spreading multi-stem
# mound of thick glossy dusty-olive leaves dotted with legible mauve-blue fan flowers.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Thick-leaved Fanflower"
scientific = "Scaevola crassifolia"
latin = "Scaevola crassifolia"
biome = "mediterranean"
tags = ["wa_native", "shrub", "coastal_dune", "coastal_limestone", "quindalup"]

[generator]
family = "weber_penn"
notes = "Low coastal foredune cushion (~1.1 m high x 2.8 m wide) with separate-material mauve-blue fan flowers."

