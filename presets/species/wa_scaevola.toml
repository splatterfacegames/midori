# Thick-leaved fanflower (Scaevola crassifolia)
# Dome-forming shrub of the foredune and limestone coast: thick, glossy, sticky toothed leaves in a dense
# wind-pruned cushion, with pale blue fan flowers in spring and summer.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Thick-leaved Fanflower"
scientific = "Scaevola crassifolia"
latin = "Scaevola crassifolia"
biome = "mediterranean"
tags = ["wa_native", "shrub", "coastal_dune", "coastal_limestone", "quindalup"]

[generator]
family = "weber_penn"
notes = "Cushion about 1.2 m high and 3 m across."

[trunk]
height = 0.25
height_variance = 0.18
radius = 0.05
taper = 0.7
taper_profile = "exponential"
curve = 30.0
curve_variance = 16.0
curve_back = 26.0
segments = 12
buttress = 0.0

[branches.level1]
count = 11
count_variance = 2
length = 1.25
length_variance = 0.22
radius_ratio = 0.62
radius_model = "ratio"
taper = 0.78
taper_profile = "exponential"
angle = 72.0
angle_variance = 18.0
rotation = 137.5
gravity = 0.0
curve = 20.0
curve_variance = 24.0
segments = 9

[branches.level2]
count = 6
count_variance = 1
length = 0.6
length_variance = 0.22
radius_ratio = 0.58
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 56.0
angle_variance = 18.0
rotation = 137.5
gravity = 0.1
curve = -18.0
curve_variance = 20.0
segments = 6

[crown]
shape = "hemispherical"
offset = 0.05
density = 1.0
width_ratio = 1.3

[leaves]
count = 1100
min_level = 1
size = 0.3
size_variance = 0.22
distribution = "both"
geometry = "cross_billboard"
shape = "oval"
up_influence = 0.4

[inflorescence]
kind = "cluster"
count = 160
min_level = 2
placement = "endpoint"
orientation = "up"
length = 0.14
width = 0.14
size_variance = 0.3
color = [0.7, 0.76, 0.94]
color_tip = [0.96, 0.92, 0.7]
aged_fraction = 0.1
aged_color = [0.52, 0.46, 0.34]

[canopy]
normals = "canopy"
normal_blend = 0.84
up_bias = 0.28
clump_weight = 0.7
clump_level = 1
crown_fill = 0
shell = 0.2
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.12
ao_strength = 0.5
roughness = 0.72

[textures]
bark_prompt = "Coastal shrub stems, grey-brown"
leaf_prompt = "Scaevola crassifolia leaves, thick, fleshy, glossy, toothed, 2-8 cm"
resolution = 1024
bark_style = "smooth"
leaf_shape = "oval"
leaf_card = "cluster"
bark_color = [0.4, 0.34, 0.27]
leaf_color = [0.26, 0.42, 0.2]

[materials]
bark = "scaevola_bark"
foliage = "scaevola_foliage"
notes = "2x2 foliage atlas: leaf spray, flowers, spent flowers."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 0.2
max = 4.0
step = 0.05

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.5
step = 0.05

[lod]
preset = "balanced"

[platform]
target = "modern_pc"
