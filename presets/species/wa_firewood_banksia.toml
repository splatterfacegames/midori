# Firewood banksia (Banksia menziesii)
# Gnarled small tree of the Bassendean sand banksia woodland: crooked trunk, thick grey pebbly bark,
# stiff saw-toothed leaves and red-and-yellow acorn-shaped flower spikes in autumn and winter.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Firewood Banksia"
scientific = "Banksia menziesii"
latin = "Banksia menziesii"
biome = "mediterranean"
tags = ["wa_native", "banksia", "banksia_woodland", "swan_coastal_plain", "evergreen", "lignotuber"]

[generator]
family = "weber_penn"
notes = "Spikes are drawn about 1.5x life size; aged spikes are the persistent grey cones."

