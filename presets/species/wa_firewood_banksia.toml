# Firewood banksia (Banksia menziesii)
# Gnarled small lignotuber tree of the Bassendean sand banksia woodland: crooked, often multi-stemmed
# trunk in thick grey pebbly bark, open irregular branch architecture, whorled stiff saw-toothed
# dull olive-grey leaves with pale undersides, and crimson-and-gold acorn flower spikes.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Firewood Banksia"
scientific = "Banksia menziesii"
latin = "Banksia menziesii"
biome = "mediterranean"
tags = ["wa_native", "banksia", "banksia_woodland", "swan_coastal_plain", "evergreen", "lignotuber"]

[generator]
