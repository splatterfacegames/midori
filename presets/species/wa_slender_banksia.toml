# Slender / candlestick banksia (Banksia attenuata)
# The commonest banksia of Perth's sandplain: a bent or wavy trunk in crumbly orange-grey bark, long narrow
# toothed leaves, and tall bright yellow 'candles' standing above the foliage in spring and summer.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Slender Banksia"
scientific = "Banksia attenuata"
latin = "Banksia attenuata"
biome = "mediterranean"
tags = ["wa_native", "banksia", "evergreen", "banksia_woodland", "swan_coastal_plain", "lignotuber"]

[generator]
family = "weber_penn"
notes = "Spikes at about life size (to 25 cm); aged spikes are brown-grey cones."

