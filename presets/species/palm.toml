# Palm (Cocos nucifera)
# Single trunk, no branches, fronds radiate from crown.

[species]
name = "Palm"
scientific = "Cocos nucifera"

[trunk]
height = 12.0
height_variance = 0.1
radius = 0.3
taper = 0.15
curve = 20.0
curve_variance = 8.0
curve_back = 0.0
segments = 15

[branches.level1]
# Fronds, not branches
count = 18
count_variance = 3
length = 4.0
length_variance = 0.15
radius_ratio = 0.08
angle = 45.0
angle_variance = 15.0
rotation = 20.0
gravity = -0.6
curve = 60.0
curve_variance = 10.0
segments = 8

# No level2/3 branches - fronds have leaflets instead

[crown]
shape = "hemispherical"
offset = 0.92
density = 1.0
width_ratio = 1.5

[leaves]
count = 1500
min_level = 1
size = 0.5
size_variance = 0.2
distribution = "along_branch"
geometry = "polygon"
shape = "willow"  # Palm leaflets are narrow and elongated
up_influence = 0.0

[textures]
bark_prompt = "Coconut palm trunk, grey-brown, horizontal ring scars, fibrous texture"
leaf_prompt = "Palm frond leaflet, long narrow blade, parallel venation, glossy green"

[lod]
preset = "balanced"

[platform]
target = "modern_pc"
