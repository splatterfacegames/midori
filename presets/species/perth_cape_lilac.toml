# Cape lilac / white cedar (Melia azedarach)
# Classic deciduous shade tree of old Perth backyards, schools and verges: rounded spreading crown
# of dark bipinnate leaves, fragrant lilac panicles in spring, golden yellow berry clusters on bare winter limbs.
# PLANTED EXOTIC in Perth (Asia & northern Australia), not part of the local Swan Coastal Plain flora.
# Botanical notes and sources: docs/wa-flora.md

