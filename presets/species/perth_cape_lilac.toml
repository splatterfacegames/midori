# Cape lilac / white cedar (Melia azedarach)
# Deciduous shade tree of old backyards, schools and farm gates: a rounded spreading crown of large
# twice-divided leaves, lilac flowers in spring, and clusters of yellow berries left hanging on bare winter branches.
# PLANTED EXOTIC in Perth (Asia and northern Australia), not part of the local flora.
# Botanical notes and sources: docs/wa-flora.md

