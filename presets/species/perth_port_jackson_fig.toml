hue_variation = 0.10
ao_strength = 0.34
billboard_lod_compensation = true
roughness = 0.56

[textures]
bark_prompt = "Port Jackson fig warm yellow-brown smooth bark with flanged buttresses and aerial roots"
leaf_prompt = "Ficus rubiginosa glossy dark green leaves with rich rusty-cinnamon hairy undersides"
resolution = 1024
bark_style = "smooth"
leaf_shape = "oval"
leaf_card = "cluster"
bark_color = [0.54, 0.46, 0.35]
leaf_color = [0.29, 0.45, 0.22]
leaf_underside_color = [0.56, 0.37, 0.20]

[materials]
bark = "port_jackson_fig_bark"
foliage = "port_jackson_fig_foliage"
notes = "1024px yellow-brown fig bark + glossy dark-green/rusty-cinnamon leaf card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 3.0
max = 14.0
step = 0.1

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.6
max = 2.0
step = 0.05

[[control_groups.controls]]
key = "buttress"
label = "Buttress"
parameter = "trunk.buttress"
min = 0.0
max = 3.0
step = 0.1

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
