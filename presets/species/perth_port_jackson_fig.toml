[leaves]
count = 3800
min_level = 2
size = 1.02
size_variance = 0.20
distribution = "both"
geometry = "cross_billboard"
shape = "oval"
up_influence = 0.12

[canopy]
normals = "canopy"
normal_blend = 0.80
up_bias = 0.28
clump_weight = 0.70
clump_level = 1
crown_fill = 0
shell = 0.16
single_sided = true
vertex_color = "tint_ao"
