# Port Jackson fig (Ficus rubiginosa)
# Smaller rounder fig of Perth parks, school ovals and older streets: warm yellow-brown buttressed
# trunk with surface and aerial roots, dense rounded crown of smaller glossy leaves rusty-cinnamon beneath.
# PLANTED EXOTIC (eastern Australia), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Port Jackson Fig"
scientific = "Ficus rubiginosa"
latin = "Ficus rubiginosa"
biome = "subtropical"
tags = ["perth_planted", "non_native", "park_tree", "fig", "evergreen", "buttressed"]

[generator]
family = "weber_penn"
notes = "14 m tall x 18 m wide park fig with exposed yellow-brown buttresses, surface/aerial roots, and rusty undersides."

[trunk]
height = 6.6
height_variance = 0.12
radius = 0.86
taper = 0.76
