# River red gum (Eucalyptus camaldulensis)
# Widely planted eucalypt of parks, verges and school ovals: a heavy trunk in smooth bark patched white,
# cream and grey over rough slabs at the base, and a broad, open crown of drooping dull grey-green leaves.
# PLANTED in Perth (native to inland and eastern Australia), not part of the local flora.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "River Red Gum"
scientific = "Eucalyptus camaldulensis"
latin = "Eucalyptus camaldulensis"
biome = "temperate"
tags = ["perth_planted", "non_native", "eucalypt", "park_tree", "evergreen"]

[generator]
