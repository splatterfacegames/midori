# River red gum (Eucalyptus camaldulensis)
# Widely planted park, verge and school-oval gum across Perth: heavy trunk with rough dark basal
# slabs transitioning into smooth mottled white, cream, grey and pink-brown upper bark, and a wide
# open level-4 crown of pendulous dull grey-green sickle leaves.
# PLANTED in Perth (native to inland/eastern Australia), not part of the local Swan Coastal Plain flora.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "River Red Gum"
scientific = "Eucalyptus camaldulensis"
latin = "Eucalyptus camaldulensis"
biome = "temperate"
tags = ["perth_planted", "non_native", "eucalypt", "park_tree", "evergreen"]

[generator]
family = "weber_penn"
notes = "22 m park eucalypt with half-barked rough basal collar -> mottled white/cream/grey/pink upper limbs and level-4 twigs."

