# Harsh hakea (Hakea prostrata)
# Prickly spreading shrub of sandplain and scarp: stiff, stem-clasping, toothed leaves on arching branches,
# with cream flowers along the stems in late winter.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Harsh Hakea"
scientific = "Hakea prostrata"
latin = "Hakea prostrata"
biome = "mediterranean"
tags = ["wa_native", "shrub", "hakea", "banksia_woodland", "darling_scarp", "heath"]

[generator]
family = "weber_penn"
notes = "Erect inland form of about 2.5 m; the coastal form is prostrate."

[trunk]
height = 0.7
height_variance = 0.18
radius = 0.07
taper = 0.7
taper_profile = "exponential"
curve = 30.0
curve_variance = 16.0
curve_back = 26.0
segments = 12
buttress = 0.0

[branches.level1]
count = 9
count_variance = 2
length = 1.7
length_variance = 0.22
radius_ratio = 0.62
radius_model = "ratio"
taper = 0.78
taper_profile = "exponential"
angle = 52.0
angle_variance = 18.0
rotation = 137.5
gravity = 0.04
curve = 26.0
curve_variance = 24.0
segments = 9

[branches.level2]
count = 5
count_variance = 1
length = 0.9
length_variance = 0.22
radius_ratio = 0.58
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 52.0
angle_variance = 18.0
rotation = 137.5
gravity = 0.05
curve = -18.0
curve_variance = 20.0
segments = 6

[crown]
shape = "spherical"
offset = 0.15
density = 1.0
width_ratio = 1.3

[leaves]
count = 900
min_level = 1
size = 0.34
size_variance = 0.22
distribution = "along_branch"
geometry = "cross_billboard"
shape = "serrated"
up_influence = 0.25

[canopy]
normals = "canopy"
normal_blend = 0.84
up_bias = 0.28
clump_weight = 0.7
clump_level = 1
crown_fill = 0
shell = 0.2
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.12
ao_strength = 0.5
roughness = 0.72

[textures]
bark_prompt = "Hakea bark, grey-brown, smooth to finely fissured"
leaf_prompt = "Hakea prostrata leaves, stiff, prickly toothed, clasping the stem"
resolution = 1024
bark_style = "smooth"
leaf_shape = "serrated"
leaf_card = "cluster"
bark_color = [0.38, 0.33, 0.28]
leaf_color = [0.3, 0.4, 0.22]

[materials]
bark = "harsh_hakea_bark"
foliage = "harsh_hakea_foliage"
notes = "1024px procedural bark and leaf card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 0.2
max = 4.0
step = 0.05

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.5
step = 0.05

[lod]
preset = "balanced"

[platform]
target = "modern_pc"
