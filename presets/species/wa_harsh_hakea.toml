# Harsh hakea (Hakea prostrata)
# Prickly open multi-stem shrub of Perth's sandplain and Darling Scarp: rigid arching stems,
# pale yellow-olive stem-clasping holly-toothed leaves, and tiny cream winter flower clusters.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Harsh Hakea"
scientific = "Hakea prostrata"
latin = "Hakea prostrata"
biome = "mediterranean"
tags = ["wa_native", "shrub", "hakea", "banksia_woodland", "darling_scarp", "heath"]

[generator]
family = "weber_penn"
notes = "Open angular multi-stem shrub (~2.4 m) with rigid prickly serrated foliage and cream axillary clusters."

