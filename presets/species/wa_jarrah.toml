# Jarrah (Eucalyptus marginata)
# Tall forest eucalypt of the Darling Scarp and plateau: straight bole to half height,
# fibrous grey-brown stringy bark charred at the base, airy level-4 crown of muted olive-grey sickle leaves.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Jarrah"
scientific = "Eucalyptus marginata"
latin = "Eucalyptus marginata"
biome = "mediterranean"
tags = ["wa_native", "eucalypt", "jarrah_forest", "darling_scarp", "evergreen", "lignotuber"]

[generator]
family = "weber_penn"
notes = "Forest form (~29 m) with level-4 outer twigs; coastal (stunted multi-stem) and post_fire (epicormic) states."

[trunk]
