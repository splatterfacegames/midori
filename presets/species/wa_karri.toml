# Karri (Eucalyptus diversicolor)
# Giant of the wet South West: a tall straight smooth bole shedding bark in patches of grey,
# cream and orange, carrying a high, comparatively small crown.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Karri"
scientific = "Eucalyptus diversicolor"
latin = "Eucalyptus diversicolor"
biome = "mediterranean"
tags = ["wa_native", "eucalypt", "karri_forest", "south_west", "evergreen", "tall_forest"]

[generator]
family = "weber_penn"
notes = "Mature forest tree of about 55 m; the tallest reach 80-90 m."

[trunk]
height = 52.0
height_variance = 0.12
radius = 1.05
taper = 0.7
taper_profile = "exponential"
curve = 4.0
curve_variance = 3.0
curve_back = 4.0
segments = 26

[branches.level1]
count = 10
count_variance = 2
length = 11.0
length_variance = 0.22
radius_ratio = 0.34
radius_model = "ratio"
taper = 0.78
taper_profile = "exponential"
angle = 48.0
angle_variance = 12.0
rotation = 137.5
gravity = -0.03
curve = 18.0
curve_variance = 18.0
segments = 14

[branches.level2]
count = 5
count_variance = 1
length = 4.4
length_variance = 0.22
radius_ratio = 0.5
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 48.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.05
curve = -14.0
curve_variance = 18.0
segments = 10

[branches.level3]
count = 4
count_variance = 1
length = 2.0
length_variance = 0.22
radius_ratio = 0.46
radius_model = "ratio"
taper = 0.78
taper_profile = "compound"
angle = 46.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.08
curve = 12.0
curve_variance = 18.0
segments = 7

[crown]
shape = "spherical"
offset = 0.62
density = 1.0
width_ratio = 0.95

[leaves]
count = 3000
min_level = 2
size = 1.6
size_variance = 0.22
distribution = "both"
geometry = "cross_billboard"
shape = "sickle"
up_influence = -0.36

[canopy]
normals = "canopy"
normal_blend = 0.84
up_bias = 0.28
clump_weight = 0.7
clump_level = 1
crown_fill = 0
shell = 0.2
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.12
ao_strength = 0.5
roughness = 0.72

[textures]
bark_prompt = "Karri bark, smooth, shed in plates leaving patches of grey, cream, salmon and orange"
leaf_prompt = "Eucalyptus diversicolor leaves, dark green above, distinctly paler below"
resolution = 1024
bark_style = "patchy"
leaf_shape = "sickle"
leaf_card = "cluster"
bark_color = [0.72, 0.7, 0.66]
leaf_color = [0.18, 0.34, 0.15]
bark_patch_colors = [[0.86, 0.8, 0.66], [0.78, 0.58, 0.42], [0.52, 0.52, 0.52]]

[materials]
bark = "karri_bark"
foliage = "karri_foliage"
notes = "1024px procedural bark and leaf card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 4.0
max = 60.0
step = 0.5

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
