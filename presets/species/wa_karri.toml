# Karri (Eucalyptus diversicolor)
# Towering giant of the wet South West: straight luminous bole shedding smooth bark in large plates
# of cream, salmon-orange and silver-grey above a short rough basal collar, carrying a high airy crown.
# Botanical notes and sources: docs/wa-flora.md

