parameter = "inflorescence.count"
min = 0.0
max = 4000.0
step = 20.0

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"

# State: October-November: blazing Perth purple-lilac blossom cloud on near-bare branches
[states.flowering]
species.name = "Jacaranda (flowering)"
leaves.count = 220
inflorescence.count = 3200

# State: late winter: leafless crooked branches hung with dark woody clam-shaped seed pods
[states.bare]
species.name = "Jacaranda (bare)"
leaves.count = 0
inflorescence.kind = "nut"
inflorescence.count = 240
inflorescence.aged_fraction = 1.0
inflorescence.length = 0.14
inflorescence.width = 0.12
inflorescence.orientation = "hang"
inflorescence.placement = "endpoint"
