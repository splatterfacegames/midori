# Jacaranda (Jacaranda mimosifolia)
# Defining street tree of Perth's older suburbs (Applecross, Subiaco, Mount Lawley, Inglewood):
# short trunk, broad spreading umbrella of fine fern-like bipinnate foliage, turning into a luminous
# lilac-purple cloud in October-November and leafless with hanging woody disc pods in late winter.
# PLANTED EXOTIC (South America), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Jacaranda"
scientific = "Jacaranda mimosifolia"
latin = "Jacaranda mimosifolia"
biome = "subtropical"
tags = ["perth_planted", "non_native", "street_tree", "semi_deciduous", "flowering", "spring"]

[generator]
family = "weber_penn"
notes = "Default summer leafy umbrella; flowering (Oct-Nov lilac cloud on dedicated Organ material); bare (winter woody disc pods)."

