[lod]
preset = "high_quality"

[platform]
target = "modern_pc"

# State: October-November: a mass of lilac flowers on near-bare branches
[states.flowering]
species.name = "Jacaranda (flowering)"
leaves.count = 260
inflorescence.count = 2800

# State: late winter: leafless, with last season's round woody seed pods
[states.bare]
species.name = "Jacaranda (bare)"
leaves.count = 0
inflorescence.count = 150
inflorescence.aged_fraction = 1.0
inflorescence.length = 0.5
inflorescence.orientation = "hang"
