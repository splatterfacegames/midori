# Jacaranda (Jacaranda mimosifolia)
# The defining street tree of Perth's older suburbs: a short trunk and a broad, open, spreading crown
# of fine fern-like leaves, turning into a cloud of lilac-purple trumpets in October and November.
# PLANTED EXOTIC (South America), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
