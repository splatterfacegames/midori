# Sugar gum (Eucalyptus cladocalyx)
# Classic avenue and park eucalypt of Perth's Kings Park (May Drive), South Perth and Subiaco:
# tall smooth mottled warm ochre-yellow, cream and blue-grey trunk supporting distinctive storied
# umbrella-clumped terminal crowns of glossy strongly discolorous dark green leaves.
# PLANTED EXOTIC in Perth (native to South Australia), not part of the local Swan Coastal Plain flora.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Sugar Gum"
scientific = "Eucalyptus cladocalyx"
latin = "Eucalyptus cladocalyx"
biome = "mediterranean"
tags = ["perth_planted", "non_native", "eucalypt", "street_tree", "park_tree", "evergreen"]

