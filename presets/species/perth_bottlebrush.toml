# Weeping bottlebrush (Melaleuca viminalis / Callistemon viminalis)
# Classic 1980s-90s Perth suburban verge and front-lawn tree: fibrous furrowed grey-brown trunk,
# graceful weeping willow-like olive-green foliage with coppery new tips, and abundant hanging
# crimson-scarlet cylindrical bottlebrush flower spikes in spring and autumn.
# PLANTED EXOTIC in Perth (native to eastern Australia), not part of the local Swan Coastal Plain flora.
# Botanical notes and sources: docs/wa-flora.md

