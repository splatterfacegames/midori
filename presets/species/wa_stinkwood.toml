# Stinkwood / green stinkwood (Jacksonia sternbergiana)
# Tall weeping leafless broom-like shrub/small tree of Perth's sandplain: airy curtains of fine
# hanging olive-sage angular branchlets dotted with bright orange-yellow pea flowers.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Stinkwood"
scientific = "Jacksonia sternbergiana"
latin = "Jacksonia sternbergiana"
biome = "mediterranean"
tags = ["wa_native", "shrub", "pea_family", "banksia_woodland", "swan_coastal_plain", "weeping"]

[generator]
family = "weber_penn"
notes = "Tall 3.6 m airy weeping leafless broom with wispy branchlet curtains and separate-material orange pea flowers."

[trunk]
