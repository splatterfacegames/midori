length = 1.3
length_variance = 0.22
radius_ratio = 0.58
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 52.0
angle_variance = 18.0
rotation = 137.5
gravity = -0.45
curve = 26.0
