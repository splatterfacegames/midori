# Stinkwood / green stinkwood (Jacksonia sternbergiana)
# Leafless weeping broom-like shrub or small tree of Perth's sandplain: green angular branchlets do the
# work of leaves, hanging in a soft grey-green curtain dotted with orange pea flowers most of the year.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Stinkwood"
scientific = "Jacksonia sternbergiana"
latin = "Jacksonia sternbergiana"
biome = "mediterranean"
tags = ["wa_native", "shrub", "pea_family", "banksia_woodland", "swan_coastal_plain", "weeping"]

[generator]
family = "weber_penn"
notes = "About 3.5 m. Branchlets are painted with the branchlet leaf shape; flowers are small orange clusters."

[trunk]
height = 2.2
height_variance = 0.18
radius = 0.1
taper = 0.7
taper_profile = "exponential"
curve = 30.0
curve_variance = 16.0
curve_back = 26.0
segments = 12
buttress = 0.0

[branches.level1]
count = 9
count_variance = 2
length = 1.9
length_variance = 0.22
radius_ratio = 0.62
radius_model = "ratio"
taper = 0.78
taper_profile = "exponential"
angle = 46.0
angle_variance = 18.0
rotation = 137.5
gravity = -0.06
curve = 28.0
curve_variance = 24.0
segments = 10

[branches.level2]
count = 5
