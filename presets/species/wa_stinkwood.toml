[leaves]
count = 1500
min_level = 2
size = 0.6
size_variance = 0.22
distribution = "along_branch"
geometry = "cross_billboard"
shape = "branchlet"
up_influence = -0.7

[inflorescence]
kind = "cluster"
count = 260
min_level = 2
placement = "along_branch"
orientation = "hang"
length = 0.16
width = 0.16
size_variance = 0.3
