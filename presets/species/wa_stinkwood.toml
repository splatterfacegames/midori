[textures]
bark_prompt = "Jacksonia sternbergiana bark, grey-brown, finely furrowed"
leaf_prompt = "Jacksonia branchlets, wispy drooping grey-olive leafless broom wires"
resolution = 1024
bark_style = "furrowed"
leaf_shape = "branchlet"
leaf_card = "cluster"
bark_color = [0.40, 0.36, 0.32]
leaf_color = [0.48, 0.55, 0.42]

[materials]
bark = "stinkwood_bark"
foliage = "stinkwood_foliage"
notes = "1024px wispy drooping branchlet card + dedicated orange-yellow pea flower atlas."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 0.6
max = 4.5
step = 0.05

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "balanced"

[platform]
target = "modern_pc"
