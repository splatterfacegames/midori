[materials]
bark = "stinkwood_bark"
foliage = "stinkwood_foliage"
notes = "2x2 foliage atlas: leaf spray, flowers, spent flowers."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 0.2
max = 4.0
step = 0.05

[[control_groups.controls]]
key = "crown_width"
