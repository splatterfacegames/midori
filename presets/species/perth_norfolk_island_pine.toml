# Norfolk Island pine (Araucaria heterophylla)
# The Cottesloe Beach foreshore icon: dead-straight vertical trunk with spaced annual whorls of
# five horizontal branches (Massart's model), flat herringbone tiers, and upturned cord-like branchlets.
# PLANTED EXOTIC (Norfolk Island), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Norfolk Island Pine"
scientific = "Araucaria heterophylla"
latin = "Araucaria heterophylla"
biome = "subtropical"
tags = ["perth_planted", "non_native", "conifer", "coastal", "evergreen", "tiered"]

[generator]
family = "weber_penn"
notes = "Massart's architectural model: 5-spoke whorls with organic internode spacing variance and upturned branchlet tips."

[trunk]
height = 26.0
height_variance = 0.10
radius = 0.54
taper = 0.85
taper_profile = "exponential"
curve = 4.2
curve_variance = 3.0
curve_back = 3.6
segments = 24
buttress = 1.15

[branches.level1]
count = 64
count_variance = 4
length = 5.6
length_variance = 0.16
radius_ratio = 0.20
radius_model = "ratio"
taper = 0.85
taper_profile = "exponential"
angle = 86.0
angle_variance = 7.5
rotation = 72.0
gravity = -0.06
curve = 18.0
curve_variance = 6.5
segments = 8
tip_upturn = 46.0
whorl_spacing_variance = 0.34

[branches.level2]
count = 10
count_variance = 2
length = 1.62
length_variance = 0.20
radius_ratio = 0.44
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 52.0
angle_variance = 12.0
rotation = 180.0
gravity = 0.12
curve = -18.0
curve_variance = 7.0
segments = 4
tip_upturn = 38.0

[crown]
shape = "conical"
offset = 0.13
density = 1.0
width_ratio = 1.12

[leaves]
count = 4400
min_level = 2
size = 0.84
size_variance = 0.18
distribution = "along_branch"
geometry = "cross_billboard"
shape = "needle"
up_influence = 0.62

[canopy]
normals = "canopy"
normal_blend = 0.78
up_bias = 0.32
clump_weight = 0.78
clump_level = 1
crown_fill = 0
shell = 0.0
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.16
hue_variation = 0.10
ao_strength = 0.42
billboard_lod_compensation = true
roughness = 0.72

[textures]
bark_prompt = "Norfolk Island pine grey-brown bark peeling in crisp horizontal ring-scarred scales"
leaf_prompt = "Araucaria heterophylla upturned braided cord-like bright sea-pine green scale branchlets"
resolution = 1024
bark_style = "plated"
leaf_shape = "needle"
leaf_card = "frond"
bark_color = [0.42, 0.36, 0.31]
leaf_color = [0.22, 0.41, 0.20]

[materials]
bark = "norfolk_island_pine_bark"
foliage = "norfolk_island_pine_foliage"
notes = "1024px horizontal-scaled bark and cord-like Araucaria frond card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 8.0
max = 40.0
step = 0.5

[[control_groups.controls]]
key = "tiers"
label = "Branches"
parameter = "branches.level1.count"
min = 25.0
max = 110.0
step = 5.0

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
