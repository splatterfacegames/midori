# Norfolk Island pine (Araucaria heterophylla)
# The Cottesloe Beach foreshore icon: dead-straight vertical trunk with spaced annual whorls of
# five horizontal branches (Massart's model), flat herringbone tiers, and upturned cord-like branchlets.
# PLANTED EXOTIC (Norfolk Island), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Norfolk Island Pine"
scientific = "Araucaria heterophylla"
latin = "Araucaria heterophylla"
biome = "subtropical"
tags = ["perth_planted", "non_native", "conifer", "coastal", "evergreen", "tiered"]

[generator]
family = "weber_penn"
notes = "Massart's architectural model: 5-spoke whorls with organic internode spacing variance and upturned branchlet tips."

[trunk]
height = 26.0
height_variance = 0.10
radius = 0.50
taper = 0.86
taper_profile = "exponential"
curve = 0.0
curve_variance = 1.0
curve_back = 0.0
segments = 24
buttress = 0.65

[branches.level1]
count = 68
count_variance = 0
length = 4.9
length_variance = 0.08
radius_ratio = 0.18
radius_model = "ratio"
taper = 0.86
taper_profile = "exponential"
angle = 88.0
angle_variance = 3.0
rotation = 72.0
gravity = 0.02
curve = -6.0
curve_variance = 2.0
segments = 8
tip_upturn = 32.0
whorl_spacing_variance = 0.22

[branches.level2]
count = 12
count_variance = 1
length = 1.22
length_variance = 0.16
radius_ratio = 0.42
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 56.0
angle_variance = 6.0
rotation = 180.0
gravity = 0.16
curve = -14.0
curve_variance = 4.0
segments = 4
tip_upturn = 32.0

[crown]
shape = "conical"
offset = 0.14
density = 1.0
width_ratio = 1.04

[leaves]
count = 4200
min_level = 2
size = 0.62
size_variance = 0.15
distribution = "along_branch"
geometry = "cross_billboard"
shape = "needle"
up_influence = 0.56

[canopy]
normals = "canopy"
normal_blend = 0.78
up_bias = 0.30
clump_weight = 0.82
clump_level = 1
crown_fill = 0
shell = 0.0
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.14
hue_variation = 0.08
ao_strength = 0.34
billboard_lod_compensation = true
roughness = 0.70

[textures]
bark_prompt = "Norfolk Island pine grey-brown bark peeling in crisp horizontal ring-scarred scales"
leaf_prompt = "Araucaria heterophylla upturned braided cord-like bright sea-pine green scale branchlets"
resolution = 1024
bark_style = "plated"
leaf_shape = "needle"
leaf_card = "cluster"
bark_color = [0.42, 0.36, 0.31]
leaf_color = [0.24, 0.44, 0.22]

[materials]
bark = "norfolk_island_pine_bark"
foliage = "norfolk_island_pine_foliage"
notes = "1024px horizontal-scaled bark and cord-like Araucaria frond card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 8.0
max = 40.0
step = 0.5

[[control_groups.controls]]
key = "tiers"
label = "Branches"
parameter = "branches.level1.count"
min = 25.0
max = 110.0
step = 5.0

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
