# Oleander (Nerium oleander)
# Ubiquitous 1980s-90s Perth freeway median, driveway and suburban fence-line shrub:
# upright multi-stemmed evergreen dome of whorled leathery lance-shaped dark green leaves
# topped with abundant rose-pink (or white) summer flower clusters.
# PLANTED EXOTIC (Mediterranean), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Oleander"
scientific = "Nerium oleander"
latin = "Nerium oleander"
biome = "mediterranean"
tags = ["perth_planted", "non_native", "shrub", "hedge", "evergreen", "flowering"]

[generator]
