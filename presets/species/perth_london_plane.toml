# London plane (Platanus x acerifolia)
# City street tree: a tall straight trunk whose bark flakes into a camouflage of grey-brown, olive and cream,
# high-pruned over the road, with a broad crown of large maple-like leaves; bare in winter with hanging seed balls.
# PLANTED EXOTIC (hybrid of garden origin), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

