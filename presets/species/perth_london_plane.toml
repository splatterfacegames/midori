# London plane (Platanus x acerifolia)
# Perth city avenue tree: tall straight camouflage-flaking trunk high-pruned over traffic,
# broad crown of maple-like leaves; winter bare with hanging seed balls; pollarded street form.
# PLANTED EXOTIC (hybrid of garden origin), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "London Plane"
scientific = "Platanus x acerifolia"
latin = "Platanus x acerifolia"
biome = "temperate"
tags = ["perth_planted", "non_native", "street_tree", "deciduous"]

[generator]
family = "weber_penn"
notes = "City street tree (~20 m) with crown lift, level-4 twigs; states: winter (bare + seed balls), pollarded (knuckle stubs)."

