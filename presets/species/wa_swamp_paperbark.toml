# Swamp paperbark (Melaleuca rhaphiophylla)
# Multi-stemmed paperbark of river banks, lakes and swamps: leaning pale cream-white papery trunks
# peeling in thick layered sheets beneath a billowing grey-sage crown of fine paperbark twigs.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Swamp Paperbark"
scientific = "Melaleuca rhaphiophylla"
