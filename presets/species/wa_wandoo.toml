# Wandoo (Eucalyptus wandoo)
# White gum of the Darling Scarp's eastern valleys and wheatbelt margin: smooth powdery white bark
# mottled with cream and grey flakes, clear bole, and an open crooked crown of cool blue-grey leaves.
# Botanical notes and sources: docs/wa-flora.md

