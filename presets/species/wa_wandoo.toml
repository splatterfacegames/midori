# Wandoo (Eucalyptus wandoo)
# White gum of the scarp's eastern valleys and the wheatbelt margin: smooth white bark mottled with
# cream and grey flakes, a clear bole to over half height and an open, dull grey-green crown.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Wandoo"
scientific = "Eucalyptus wandoo"
latin = "Eucalyptus wandoo"
biome = "mediterranean"
tags = ["wa_native", "eucalypt", "wandoo_woodland", "darling_scarp", "evergreen"]

[generator]
family = "weber_penn"
notes = "Woodland tree of about 20 m."

[trunk]
height = 17.0
height_variance = 0.14
radius = 0.45
taper = 0.72
taper_profile = "exponential"
curve = 14.0
curve_variance = 8.0
curve_back = 14.0
segments = 22

[branches.level1]
count = 8
count_variance = 2
length = 6.4
length_variance = 0.22
radius_ratio = 0.46
radius_model = "ratio"
taper = 0.78
taper_profile = "exponential"
angle = 48.0
angle_variance = 14.0
rotation = 137.5
gravity = 0.0
curve = 20.0
curve_variance = 20.0
segments = 13

[branches.level2]
count = 5
count_variance = 1
length = 3.2
length_variance = 0.22
radius_ratio = 0.52
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 46.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.05
curve = -14.0
curve_variance = 18.0
segments = 9

[branches.level3]
count = 4
count_variance = 1
length = 1.5
length_variance = 0.22
radius_ratio = 0.46
radius_model = "ratio"
taper = 0.78
taper_profile = "compound"
angle = 44.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.06
curve = 12.0
curve_variance = 18.0
segments = 6

[crown]
shape = "spherical"
offset = 0.56
density = 1.0
width_ratio = 1.05

[leaves]
count = 2200
min_level = 2
size = 1.05
size_variance = 0.22
distribution = "both"
geometry = "cross_billboard"
shape = "sickle"
up_influence = -0.36

[canopy]
normals = "canopy"
normal_blend = 0.84
up_bias = 0.28
clump_weight = 0.7
clump_level = 1
crown_fill = 0
shell = 0.2
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.12
ao_strength = 0.5
roughness = 0.72

[textures]
bark_prompt = "Wandoo bark, smooth, white, mottled with cream, yellow-brown and grey shedding flakes"
leaf_prompt = "Eucalyptus wandoo leaves, dull grey-green to blue-green, lanceolate"
resolution = 1024
bark_style = "patchy"
leaf_shape = "sickle"
leaf_card = "cluster"
bark_color = [0.88, 0.86, 0.8]
leaf_color = [0.32, 0.41, 0.27]
bark_patch_colors = [[0.8, 0.72, 0.58], [0.66, 0.64, 0.62], [0.93, 0.91, 0.86]]

[materials]
bark = "wandoo_bark"
foliage = "wandoo_foliage"
notes = "1024px procedural bark and leaf card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 4.0
max = 60.0
step = 0.5

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
