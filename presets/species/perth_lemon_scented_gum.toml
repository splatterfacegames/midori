[crown]
shape = "spherical"
offset = 0.6
density = 1.0
width_ratio = 1.0

[leaves]
count = 1500
min_level = 2
size = 1.15
size_variance = 0.22
distribution = "both"
geometry = "cross_billboard"
shape = "sickle"
