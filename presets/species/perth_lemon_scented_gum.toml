[canopy]
normals = "canopy"
normal_blend = 0.84
up_bias = 0.28
clump_weight = 0.7
clump_level = 1
crown_fill = 0
shell = 0.1
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.12
ao_strength = 0.36
roughness = 0.72

[textures]
bark_prompt = "Lemon-scented gum bark, smooth, powdery, white to pale pink and grey, shed in thin flakes"
leaf_prompt = "Corymbia citriodora leaves, narrow lanceolate 10-23 cm, mid green, drooping"
resolution = 1024
bark_style = "patchy"
leaf_shape = "sickle"
leaf_card = "cluster"
bark_color = [0.91, 0.88, 0.85]
leaf_color = [0.27, 0.42, 0.2]
bark_patch_colors = [[0.92, 0.82, 0.78], [0.82, 0.8, 0.79]]

[materials]
bark = "lemon_scented_gum_bark"
foliage = "lemon_scented_gum_foliage"
notes = "1024px procedural bark and leaf card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 4.0
max = 60.0
step = 0.5

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"
