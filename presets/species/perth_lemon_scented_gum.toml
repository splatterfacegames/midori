# Lemon-scented gum (Corymbia citriodora)
# Iconic Fraser Avenue tree of Kings Park: tall, slender, dead-straight trunk in smooth powdery
# white-to-blush-pink dimpled bark, clean for two-thirds of its height under a lofty airy crown.
# PLANTED in Perth (native to Queensland), not part of the local Swan Coastal Plain flora.
# Botanical notes and sources: docs/wa-flora.md

