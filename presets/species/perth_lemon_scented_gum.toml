# Lemon-scented gum (Corymbia citriodora)
# The Fraser Avenue tree: a tall, slender, dead-straight trunk in smooth powdery white-to-pink bark,
# clean for most of its height, under a high, sparse, airy crown of narrow drooping leaves.
# PLANTED in Perth (native to Queensland), not part of the local flora.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Lemon-scented Gum"
scientific = "Corymbia citriodora"
latin = "Corymbia citriodora"
biome = "subtropical"
tags = ["perth_planted", "non_native", "bloodwood", "street_tree", "park_tree", "evergreen"]

[generator]
family = "weber_penn"
notes = "Avenue tree of about 28 m."

[trunk]
height = 26.0
height_variance = 0.12
radius = 0.42
taper = 0.7
taper_profile = "exponential"
curve = 5.0
curve_variance = 3.0
curve_back = 5.0
segments = 24
buttress = 0.5

[branches.level1]
count = 7
count_variance = 1
length = 6.8
length_variance = 0.22
radius_ratio = 0.4
radius_model = "ratio"
taper = 0.78
taper_profile = "exponential"
angle = 46.0
angle_variance = 12.0
rotation = 137.5
gravity = 0.0
curve = 18.0
curve_variance = 18.0
segments = 13

[branches.level2]
count = 4
