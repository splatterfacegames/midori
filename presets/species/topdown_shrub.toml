# Top-down shrub / bush clump for RTS / top-down cameras.
# Game scale: ~0.8 tall, ~1.1 across. Short multi-stem base under a low,
# lumpy dome of puff canopy cards (same look as topdown_broadleaf).

[species]
name = "Topdown Shrub"
scientific = "Corylus/Buxus (stylised)"
biome = "temperate"
tags = ["shrub", "bush", "topdown", "rts"]

[generator]
family = "weber_penn"

[trunk]
height = 0.45
height_variance = 0.1
radius = 0.035
taper = 0.7
curve = 4.0
curve_variance = 3.0
segments = 3

[branches.level1]
count = 7
count_variance = 1
length = 0.55
length_variance = 0.25
radius_ratio = 0.6
angle = 62.0
angle_variance = 15.0
rotation = 137.5
gravity = 0.0
curve = 15.0
curve_variance = 8.0
segments = 2

[branches.level2]
count = 3
count_variance = 1
length = 0.25
length_variance = 0.3
radius_ratio = 0.5
angle = 45.0
angle_variance = 15.0
rotation = 137.5
gravity = 0.0
curve = 10.0
segments = 2

[crown]
shape = "hemispherical"
offset = 0.1
density = 1.0
width_ratio = 1.0

[leaves]
count = 380
min_level = 1
size = 0.2
size_variance = 0.25
distribution = "both"
geometry = "canopy_card"
shape = "oval"
up_influence = 0.5

[canopy]
normals = "canopy"
normal_blend = 0.95
up_bias = 0.15
clump_weight = 0.65
clump_level = 1
crown_fill = 140
shell = 0.4
card_tilt = 30.0
card_max_angle = 70.0
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.2
hue_variation = 0.16
ao_strength = 0.65
roughness = 0.92

[textures]
resolution = 256
bark_style = "smooth"
leaf_shape = "oval"
leaf_card = "puff"
bark_color = [0.34, 0.28, 0.22]
leaf_color = [0.30, 0.47, 0.15]

[lod]
preset = "custom"

[[lod.levels]]
index = 0
name = "LOD0"
target_triangles = 1200
branch_levels = 0
leaf_geometry = "canopy_card"
leaf_reduction = 1.0
ring_resolution = [4, 3, 3, 3]
screen_height = 0.1

[[lod.levels]]
index = 1
name = "LOD1"
target_triangles = 350
branch_levels = 0
leaf_geometry = "canopy_card"
leaf_reduction = 0.3
ring_resolution = [3, 3, 3, 3]
screen_height = 0.03

[platform]
target = "modern_pc"
