# Coral tree (Erythrina x sykesii)
# Iconic winter-flowering park and riverfront tree of older Perth suburbs (South Perth, Subiaco,
# Guildford, Nedlands): broad gnarled spreading corky grey trunk, bold trifoliate diamond leaves
# in summer; bare sculptural limbs ablaze with upright scarlet-red pea-flower racemes in Aug-Nov.
# PLANTED EXOTIC (sterile garden hybrid), not a Western Australian native.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Coral Tree"
scientific = "Erythrina x sykesii"
latin = "Erythrina x sykesii"
biome = "subtropical"
tags = ["perth_planted", "non_native", "park_tree", "deciduous", "flowering", "winter"]

[generator]
family = "weber_penn"
notes = "Default summer broad trifoliate canopy; [states.winter] bare sculptural limbs covered in upright scarlet racemes."

