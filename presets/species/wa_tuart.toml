# Tuart (Eucalyptus gomphocephala)
# The big eucalypt of the coastal limestone belt: stout trunk in rough grey box bark and, grown in the
# open, a broad spreading crown of glossy light green leaves up to 25 m across.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Tuart"
scientific = "Eucalyptus gomphocephala"
latin = "Eucalyptus gomphocephala"
biome = "mediterranean"
tags = ["wa_native", "eucalypt", "coastal_limestone", "swan_coastal_plain", "evergreen"]

[generator]
family = "weber_penn"
notes = "Open-grown spreading form (about 22 m). The forest state is the taller, narrower tuart-forest tree."

[trunk]
height = 15.0
height_variance = 0.14
radius = 0.85
taper = 0.72
taper_profile = "exponential"
curve = 16.0
curve_variance = 9.0
curve_back = 16.0
segments = 22

[branches.level1]
count = 9
count_variance = 2
length = 10.0
length_variance = 0.22
radius_ratio = 0.5
radius_model = "ratio"
taper = 0.78
taper_profile = "exponential"
angle = 62.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.04
curve = 24.0
curve_variance = 22.0
segments = 14

[branches.level2]
count = 6
count_variance = 1
length = 4.6
length_variance = 0.22
radius_ratio = 0.54
radius_model = "ratio"
taper = 0.78
taper_profile = "smooth"
angle = 52.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.05
curve = -16.0
curve_variance = 18.0
segments = 10

[branches.level3]
count = 4
count_variance = 1
length = 2.0
length_variance = 0.22
radius_ratio = 0.46
radius_model = "ratio"
taper = 0.78
taper_profile = "compound"
angle = 48.0
angle_variance = 14.0
rotation = 137.5
gravity = -0.08
curve = 14.0
curve_variance = 18.0
segments = 7

[crown]
shape = "hemispherical"
offset = 0.3
density = 1.0
width_ratio = 1.25

[leaves]
count = 3400
min_level = 2
size = 1.35
size_variance = 0.22
distribution = "both"
geometry = "cross_billboard"
shape = "sickle"
up_influence = -0.34

[canopy]
normals = "canopy"
normal_blend = 0.84
up_bias = 0.28
clump_weight = 0.7
clump_level = 1
crown_fill = 0
shell = 0.2
single_sided = true
vertex_color = "tint_ao"
tint_variation = 0.18
hue_variation = 0.12
ao_strength = 0.5
roughness = 0.72

[textures]
bark_prompt = "Tuart bark, rough, grey, finely fibrous box bark throughout"
leaf_prompt = "Eucalyptus gomphocephala leaves, glossy light green, curved lanceolate"
resolution = 1024
bark_style = "tessellated"
leaf_shape = "sickle"
leaf_card = "cluster"
bark_color = [0.5, 0.48, 0.45]
leaf_color = [0.25, 0.42, 0.17]

[materials]
bark = "tuart_bark"
foliage = "tuart_foliage"
notes = "1024px procedural bark and leaf card."

[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 4.0
max = 60.0
step = 0.5

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.5
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"

# State: tall forest tuart (about 35 m) with a clear bole
[states.forest]
species.name = "Tuart (forest)"
trunk.height = 27.0
crown.offset = 0.48
crown.width_ratio = 1.0
crown.shape = "spherical"
branches.level1.length = 8.5
branches.level1.angle = 52.0
