# Tuart (Eucalyptus gomphocephala)
# The great eucalypt of WA's coastal limestone belt: stout trunk in pale grey finely fibrous box bark
# supporting a broad spreading dome of silvery-olive curved leaves up to 25 m across.
# Botanical notes and sources: docs/wa-flora.md

[species]
name = "Tuart"
scientific = "Eucalyptus gomphocephala"
latin = "Eucalyptus gomphocephala"
biome = "mediterranean"
tags = ["wa_native", "eucalypt", "coastal_limestone", "swan_coastal_plain", "evergreen"]

[generator]
family = "weber_penn"
notes = "Open-grown spreading coastal limestone monarch (~22 m) with level-4 twigs; [states.forest] is the taller forest bole."

