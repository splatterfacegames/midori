[[control_groups]]
key = "shape"
label = "Shape"

[[control_groups.controls]]
key = "height"
label = "Height"
parameter = "trunk.height"
min = 6.0
max = 45.0
step = 0.5

[[control_groups.controls]]
key = "crown_width"
label = "Crown Width"
parameter = "crown.width_ratio"
min = 0.6
max = 2.0
step = 0.05

[lod]
preset = "high_quality"

[platform]
target = "modern_pc"

# State: tall forest tuart (~34 m) with clear bole
[states.forest]
species.name = "Tuart (forest)"
trunk.height = 30.0
crown.offset = 0.50
crown.width_ratio = 0.98
crown.shape = "spherical"
branches.level1.length = 8.6
branches.level1.angle = 50.0
