name: Release

# Builds release artifacts when a `v*` tag is pushed: `midori` CLI binaries
# (with bundled presets) for linux/windows/macos, native Tauri 2 desktop
# installers (.exe, .dmg, .deb), the wasm npm tarball (wasm-opt'd), the
# workbench app bundle, and a crates.io dry-run of the publishable crates.
# See docs/releasing.md for the full process.

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  WASM_PACK_VERSION: 0.15.0
  BINARYEN_VERSION: 132.0.0
  HAS_CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}

jobs:
  # Tag must match the workspace + desktop version before anything builds.
  version-check:
    name: Tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - run: node scripts/check-version.mjs "${{ github.ref_name }}"

  cli:
    name: midori ${{ matrix.name }}
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-unknown-linux-gnu, os: ubuntu-latest, ext: tar.gz, target: x86_64-unknown-linux-gnu }
          - { name: x86_64-pc-windows-msvc, os: windows-latest, ext: zip, target: x86_64-pc-windows-msvc }
          # macos-13 (last Intel runner label) is retired — x86_64 mac builds
          # cross-compile on the ARM runner via cargo --target.
          - { name: x86_64-apple-darwin, os: macos-latest, ext: tar.gz, target: x86_64-apple-darwin }
          - { name: aarch64-apple-darwin, os: macos-latest, ext: tar.gz, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build midori
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked -p midori-cli --target ${{ matrix.target }}
      - name: Package binary + presets
        shell: bash
        run: |
          set -euo pipefail
          name="midori-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p "release/$name"
          cp -r presets "release/$name/"
          cp README.md LICENSE* "release/$name/" 2>/dev/null || true
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/midori.exe" "release/$name/"
            (cd release && 7z a "$name.zip" "$name")
          else
            cp "target/${{ matrix.target }}/release/midori" "release/$name/"
            tar -C release -czf "release/$name.tar.gz" "$name"
          fi
          ls -la release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.name }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.platform }}
    needs: [version-check, workbench]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest, bundle: nsis, ext: setup.exe, dir: nsis, pattern: "*.exe" }
          - { platform: macos-arm64, os: macos-latest, bundle: dmg, ext: dmg, dir: dmg, pattern: "*.dmg" }
          - { platform: linux-amd64, os: ubuntu-latest, bundle: deb, ext: deb, dir: deb, pattern: "*.deb" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - name: Unpack prebuilt workbench dist/
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workbench
          path: workbench-artifact
      - name: Extract dist/
        shell: bash
        run: |
          mkdir -p dist
          tar -xzf "workbench-artifact/midori-workbench-${{ github.ref_name }}.tar.gz" -C dist
          ls -la dist/
      - name: Install Linux WebKitGTK dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Configure git auth for private jethaforge dep
        shell: bash
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global credential.helper \
            '!f() { echo "username=x-access-token"; echo "password=${{ secrets.JETHAFORGE_TOKEN }}"; }; f'
          git ls-remote https://github.com/splatterfacegames/jethaforge.git HEAD >/dev/null
      - name: Build Tauri desktop installer
        working-directory: crates/midori-desktop
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles ${{ matrix.bundle }}
      - name: Stage installer artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          src=$(find "crates/midori-desktop/target/release/bundle/${{ matrix.dir }}" -maxdepth 1 -type f -name "${{ matrix.pattern }}" | head -n 1)
          if [ -z "$src" ]; then
            echo "Installer bundle not found in crates/midori-desktop/target/release/bundle/${{ matrix.dir }}" >&2
            exit 1
          fi
          dst="release/midori-desktop-${{ github.ref_name }}-${{ matrix.platform }}"
          if [ "${{ matrix.ext }}" = "setup.exe" ]; then
            dst="${dst}-setup.exe"
          else
            dst="${dst}.${{ matrix.ext }}"
          fi
          cp "$src" "$dst"
          ls -lh release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  wasm-package:
    name: midori-wasm npm tarball
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Install pinned wasm-pack
        run: |
          curl -L -o /tmp/wasm-pack.tar.gz \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          mkdir -p "$HOME/.cargo/bin"
          cp "/tmp/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.cargo/bin/"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          wasm-pack --version
      - name: Build wasm package
        run: wasm-pack build crates/midori-wasm --target web --release --out-dir "$PWD/pkg-release"
      - name: wasm-opt -O2 and report size
        run: |
          npm i --prefix /tmp/binaryen --no-save binaryen@${BINARYEN_VERSION}
          wasm=pkg-release/midori_wasm_bg.wasm
          before=$(stat -c%s "$wasm")
          /tmp/binaryen/node_modules/.bin/wasm-opt -O2 -o "$wasm.opt" "$wasm"
          mv "$wasm.opt" "$wasm"
          after=$(stat -c%s "$wasm")
          mkdir -p release
          echo "wasm-opt -O2: $before -> $after bytes" | tee release/wasm-size.txt
      - name: npm pack
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"; version="${version#v}"
          cd pkg-release
          npm pkg set name="@midori/wasm" version="$version"
          npm pack --pack-destination ../release
          mv ../release/midori-wasm-*.tgz "../release/midori-wasm-${{ github.ref_name }}.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-npm
          path: |
            release/*.tgz
            release/wasm-size.txt

  workbench:
    name: workbench bundle
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Configure git auth for private jethaforge dep
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global credential.helper \
            '!f() { echo "username=x-access-token"; echo "password=${{ secrets.JETHAFORGE_TOKEN }}"; }; f'
          git ls-remote https://github.com/splatterfacegames/jethaforge.git HEAD >/dev/null
      - run: npm ci
      - run: npm run build
      # vite.config.ts emits the bundle to repo-root `dist/`.
      - run: |
          mkdir -p release
          tar -czf "release/midori-workbench-${{ github.ref_name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench
          path: release/*.tar.gz

  crates-dry-run:
    name: cargo publish --dry-run
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: cargo publish --dry-run
        if: ${{ env.HAS_CRATES_TOKEN == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --dry-run --locked -p midori-core -p midori-contracts -p midori-ui-domain
      - name: note
        if: ${{ env.HAS_CRATES_TOKEN != 'true' }}
        run: echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io dry-run"

  github-release:
    name: GitHub Release
    needs: [version-check, cli, desktop, wasm-package, workbench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.tgz' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \) | sort)
          echo "Artifacts:"; echo "$files"
          # Release notes = this version's CHANGELOG section.
          v="${{ github.ref_name }}"; v="${v#v}"
          awk -v v="$v" 'BEGIN{p=0} /^## \[/{ if(p) exit; if(index($0, "[" v "]")) p=1 } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          gh release create "${{ github.ref_name }}" \
            --title "Midori ${{ github.ref_name }}" \
            --notes-file notes.md \
            $files
