[package]
name = "tools-frontend-host-tauri"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-tools-frontend-host"
build = "build.rs"
license = "MIT"
[lib]
name = "tools_frontend_host_tauri"
[dependencies]
tools-frontend-contracts = { path = "../tools-frontend-contracts" }
flatbuffers = { version = "=25.12.19", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", default-features = false }
[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
