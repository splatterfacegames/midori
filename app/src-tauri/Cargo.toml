[package]
name = "midori-app"
version = "0.1.0"
description = "Midori tree workbench on the shared tools frontend stack"
edition = "2021"
rust-version = "1.85"

[lib]
name = "midori_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0" }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0" }
tauri-plugin-log = "2"
# Shared native window host. There is no published registry or Git rev for this
# crate in the lab, so it is consumed from the reviewed checkout by path. The npm
# half of the shared stack IS installed from the packed tarball with a pinned
# lockfile integrity; this Cargo edge is the remaining gap. See README.md.
tools-frontend-host-tauri = { path = "../../../../lab-shared-main-bdade495/source/crates/tools-frontend-host-tauri" }

# The tree slice.
midori-contracts = { path = "../../crates/midori-contracts" }
midori-ui-domain = { path = "../../crates/midori-ui-domain" }
# Only to name `MaterialType` when mapping submesh roles onto the contract enum.
midori-core = { path = "../../crates/midori-core" }
sha2 = "=0.10.9"
# Reopens an exported GLB from disk and reads back what is actually in it.
gltf = "1.4"

