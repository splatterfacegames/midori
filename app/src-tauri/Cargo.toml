[package]
name = "midori-app"
version = "0.1.0"
description = "Midori tree workbench on the shared tools frontend stack"
edition = "2021"
rust-version = "1.85"

[lib]
name = "midori_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0" }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0" }
tauri-plugin-log = "2"
# Shared native window host. Vendored into app/vendor/ rather than referenced
# in place: the reviewed checkout is not a Git repository and the crate is not
# published, so there is no rev or version to pin it to. The vendored tree is
# byte-identical to its source and every file is digested in
# app/vendor/PROVENANCE.json, which src-tauri/tests/vendor.rs re-verifies.
tools-frontend-host-tauri = { path = "../vendor/crates/tools-frontend-host-tauri" }

# The tree slice.
midori-contracts = { path = "../../crates/midori-contracts" }
midori-ui-domain = { path = "../../crates/midori-ui-domain" }
# Only to name `MaterialType` when mapping submesh roles onto the contract enum.
midori-core = { path = "../../crates/midori-core" }
sha2 = "=0.10.9"
# Reopens an exported GLB from disk and reads back what is actually in it.
gltf = "1.4"


[dev-dependencies]
# `tests/vendor.rs` re-digests the vendored shared crates.
sha2 = "=0.10.9"
serde_json = "1.0"
